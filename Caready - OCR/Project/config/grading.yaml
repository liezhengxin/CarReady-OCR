# =========================================================================
# EXTERIOR GRADING RUBRIC
# =========================================================================
#
#   *** THIS IS A PLACEHOLDER RUBRIC. IT IS NOT CAREADY'S GRADING SCALE. ***
#
# Caready's actual grading scale and rubric is an unresolved dependency.
# See docs/OPEN_ITEMS.md item #1.
#
# `rubric_status: PLACEHOLDER` is read by the API and propagated to:
#   - a warning banner on every unit detail view in the dashboard
#   - a `confidence` downgrade on every price result computed from this rubric
#   - the `rubric_status` field of every persisted grade row
#
# Change `rubric_status` to ACTIVE only once Caready has signed off on the
# bands and weights below. Do not remove the field.
#
# Acceptance criterion (M6): editing this file changes computed grades with
# zero code changes. There are no grading constants anywhere in Python.
# =========================================================================

version: "0.1.0-placeholder"
rubric_status: PLACEHOLDER

# -------------------------------------------------------------------------
# Scoring model
# -------------------------------------------------------------------------
# A unit starts at 0 damage points. Each detected damage contributes:
#
#   points = base_points[damage_type][severity]
#          * panel_weight[panel]
#          * area_multiplier(area_ratio)
#
# Points are summed across all detections, then mapped to a grade band.
# HIGHER SCORE = WORSE CONDITION.
#
# Rationale for an additive point model over a rules tree: it is auditable
# (every point is attributable to one detection), it degrades gracefully with
# partial detections, and it produces a continuous score usable as a pricing
# feature rather than only a categorical grade.
# -------------------------------------------------------------------------

scoring:
  # Detections below this confidence are excluded from the score entirely and
  # routed to the appraiser review queue instead. They are never silently
  # dropped - the count of excluded detections is shown in the UI.
  min_detection_confidence: 0.45

  # Area of the detection bounding box as a fraction of the panel's area.
  # Piecewise multiplier; interpolated linearly between breakpoints.
  area_multiplier:
    breakpoints:
      - { area_ratio: 0.00, multiplier: 0.6 }
      - { area_ratio: 0.05, multiplier: 1.0 }
      - { area_ratio: 0.20, multiplier: 1.4 }
      - { area_ratio: 0.50, multiplier: 1.8 }
      - { area_ratio: 1.00, multiplier: 2.0 }
    # Applied when the provider returns no area estimate.
    default_when_missing: 1.0

  # Same panel + same damage type detected in multiple photos is one damage
  # seen from two angles, not two damages. Detections are deduplicated by
  # (panel, damage_type) keeping the highest severity, then the highest area.
  deduplicate_by_panel_and_type: true

# -------------------------------------------------------------------------
# Base points per damage type and severity
# -------------------------------------------------------------------------
#   severity 1 = minor      (polish / touch-up)
#   severity 2 = moderate   (panel work required)
#   severity 3 = severe     (replacement required)
#
# NOTE on celah_panel: panel gap and misalignment is the strongest
# exterior-visible proxy for prior collision repair. It is deliberately
# weighted far above an equivalent-area scratch. A 10cm scratch is a cosmetic
# cost; a 10mm panel gap is evidence of structural repair history and moves
# resale value by a different order of magnitude.
# -------------------------------------------------------------------------

base_points:
  baret:            { 1: 1,  2: 3,  3: 6 }
  penyok:           { 1: 2,  2: 6,  3: 12 }
  karat:            { 1: 4,  2: 10, 3: 20 }
  cat_ulang:        { 1: 3,  2: 8,  3: 15 }
  retak:            { 1: 3,  2: 8,  3: 16 }
  pecah:            { 1: 6,  2: 14, 3: 25 }
  celah_panel:      { 1: 8,  2: 18, 3: 32 }
  komponen_hilang:  { 1: 5,  2: 12, 3: 22 }

# -------------------------------------------------------------------------
# Panel weights
# -------------------------------------------------------------------------
# Weight reflects (a) cost to rectify and (b) how strongly damage there
# signals something worse. Structural panels (quarter panel, roof) are
# weighted above bolt-on panels (bumper, fender) because they cannot be
# unbolted and replaced - damage there implies bodywork.
# -------------------------------------------------------------------------

panel_weights:
  front_bumper:     0.8
  rear_bumper:      0.8
  hood:             1.2
  roof:             1.3
  trunk_tailgate:   1.1
  fender_fl:        1.0
  fender_fr:        1.0
  door_fl:          1.0
  door_fr:          1.0
  door_rl:          0.95
  door_rr:          0.95
  quarter_panel_l:  1.4
  quarter_panel_r:  1.4
  windshield:       1.2
  rear_glass:       1.0
  headlamp_l:       0.9
  headlamp_r:       0.9
  taillamp_l:       0.85
  taillamp_r:       0.85
  grille:           0.7
  mirror_l:         0.5
  mirror_r:         0.5
  wheel_fl:         0.6
  wheel_fr:         0.6
  wheel_rl:         0.6
  wheel_rr:         0.6
  tire_fl:          0.5
  tire_fr:          0.5
  tire_rl:          0.5
  tire_rr:          0.5

# -------------------------------------------------------------------------
# Grade bands
# -------------------------------------------------------------------------
# Ordered best to worst. `max_score` is inclusive; the last band must have
# `max_score: null` to act as the catch-all. Labels are placeholders - Caready
# may use a numeric scale (5 / 4.5 / 4 ...) instead, in which case only the
# labels and thresholds below change.
# -------------------------------------------------------------------------

grade_bands:
  - { label: "A", max_score: 15,   description: "Siap jual, perbaikan kosmetik minimal" }
  - { label: "B", max_score: 35,   description: "Perbaikan ringan, satu atau dua panel" }
  - { label: "C", max_score: 60,   description: "Perbaikan sedang, beberapa panel" }
  - { label: "D", max_score: 90,   description: "Perbaikan berat" }
  - { label: "E", max_score: null, description: "Perbaikan sangat berat / jual kondisi apa adanya" }

# -------------------------------------------------------------------------
# Automatic downgrade rules
# -------------------------------------------------------------------------
# Applied AFTER band lookup. A rule can only make the grade worse, never
# better. `cap_at` means "the grade may not be better than this label".
#
# These encode the judgements the additive score cannot: a single severe
# structural signal should not be averaged away by an otherwise clean car.
#
# Evaluation order is top to bottom; the worst applicable cap wins. Every
# applied rule is recorded on the grade row and shown in the UI, so an
# appraiser can always see why a grade was capped.
# -------------------------------------------------------------------------

downgrade_rules:
  - id: panel_gap_moderate
    description: >-
      Panel gap at severity 2+ indicates prior collision repair regardless of
      overall cosmetic condition.
    when:
      any_detection:
        damage_type: celah_panel
        min_severity: 2
    cap_at: "C"

  - id: panel_gap_severe
    description: "Severe panel misalignment - assume structural repair."
    when:
      any_detection:
        damage_type: celah_panel
        min_severity: 3
    cap_at: "D"

  - id: rust_severe
    description: "Severe rust anywhere - penetrating corrosion is rarely local."
    when:
      any_detection:
        damage_type: karat
        min_severity: 3
    cap_at: "D"

  - id: repaint_cluster
    description: >-
      Repaint detected on 2+ adjacent panels is a collision-repair signature,
      not routine touch-up.
    when:
      detection_count:
        damage_type: cat_ulang
        min_severity: 1
        min_panels: 2
    cap_at: "C"

  - id: structural_panel_severe
    description: "Severe damage to a non-bolt-on structural panel."
    when:
      any_detection:
        panels: [roof, quarter_panel_l, quarter_panel_r]
        min_severity: 3
    cap_at: "D"

  - id: glass_broken
    description: "Shattered windshield - safety item, must be replaced."
    when:
      any_detection:
        panels: [windshield]
        damage_type: pecah
        min_severity: 1
    cap_at: "C"

# -------------------------------------------------------------------------
# Incomplete evidence handling
# -------------------------------------------------------------------------
# A grade computed from an incomplete photo set is not comparable to one
# computed from a complete set. Rather than guess, the grade is marked
# provisional and pricing confidence degrades.
# -------------------------------------------------------------------------

incomplete_evidence:
  # All nine exterior angles are mandatory (§7.1). If any is missing the
  # grading job refuses to produce a final grade.
  require_all_exterior_angles: true
  on_missing_angle: REFUSE   # REFUSE | PROVISIONAL
  # If the vision provider returned nothing at all for a panel group, treat
  # that group as unassessed rather than as clean.
  unassessed_group_marks_provisional: true
