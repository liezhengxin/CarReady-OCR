# -------------------------------------------------------------------------
# VDS -> variant mapping
# -------------------------------------------------------------------------
# NOT seeded from a standards assumption. Built EMPIRICALLY from Caready's own
# historical data: for each (wmi, vds) prefix observed, record which variant
# the appraiser resolved the unit to, and count support.
#
# The mapping is applied only when support and purity clear the thresholds in
# config/crosschecks.yaml (vin_decode.vds_min_support_count / vds_min_purity).
#
# Rows live in the `vds_variant_map` table, not in this file. This block only
# configures how that table is built and consumed.
# -------------------------------------------------------------------------

vds_mapping:
  # How many leading VDS characters form the key. Shorter = more support per
  # key but coarser; 4 is a reasonable starting point for Asian schemes where
  # the trailing VDS characters often encode options rather than trim.
  prefix_length: 4
  rebuild_cron: "0 4 * * 0"
  # A key whose supporting rows disagree above this rate is not applied at all.
  max_disagreement_rate: 0.15
  # Only historical units whose variant was resolved by a human contribute -
  # otherwise an auto-matched error propagates into the decoder that is meant
  # to catch it.
  contributing_resolution_methods: [manual]
