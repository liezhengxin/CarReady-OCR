# =========================================================================
# WMI LOOKUP TABLE (VIN characters 1-3)
# =========================================================================
# Used by the OPTIONAL VIN enrichment layer only (§5.3).
#
# The STNK is authoritative for brand / type / model / year. This table can
# raise a disagreement flag. It can never overwrite an STNK value.
#
# Coverage here is partial by design. Indonesian-market VIN practice is not
# uniform: many domestic CKD units use manufacturer-local schemes, and the
# ISO 3779 model-year character is unreliable. An undecodable VIN is an
# expected outcome, reported as INFO, not an error.
#
# Entries are seeded from publicly observable manufacturer prefixes and MUST
# be verified against Caready's own historical data before being relied on.
# `verified` marks which rows have been checked against real units.
# =========================================================================

version: "0.1.0"
status: SEEDED_UNVERIFIED

# Positions within the 17-character VIN, 1-indexed and inclusive.
structure:
  wmi: [1, 3]
  vds: [4, 9]
  check_digit: 9
  model_year_char: 10
  plant_char: 11
  serial: [12, 17]
  # Check-digit validation (position 9) is a North-American requirement and is
  # not consistently applied by Asian manufacturers. Computed and recorded for
  # information, never used to reject a VIN.
  validate_check_digit: false
  # See config/crosschecks.yaml vin_decode.decode_model_year - disabled.
  model_year_map_enabled: false

# -------------------------------------------------------------------------
# WMI entries
# -------------------------------------------------------------------------
#   wmi        three-character prefix
#   brand      canonical brand name, must resolve against the catalog
#   country    country of manufacture
#   verified   has this prefix been confirmed against Caready historical data
# -------------------------------------------------------------------------

