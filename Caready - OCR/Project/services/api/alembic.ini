[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# The URL is set at runtime from app.config.Settings (see alembic/env.py) so
# there is exactly one place a connection string is configured. The value here
# is a placeholder and is always overwritten.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Migration filenames sort by their numeric prefix rather than by a random
# revision hash, which makes `ls versions/` a readable history.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
