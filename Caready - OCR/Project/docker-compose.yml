# Development stack. `docker compose up` gives a working system with seeded
# synthetic data - the M0 acceptance criterion.
#
# Not a production topology: no TLS termination, no replicas, no secrets
# manager, single-node object storage, MLflow on a file backend. Production
# concerns are in docs/ARCHITECTURE.md.

name: caready

x-python-env: &python-env
  ENVIRONMENT: dev
  DEBUG: "true"
  LOG_LEVEL: INFO
  LOG_FORMAT: console
  SYNTHETIC_DATA_MODE: "true"
  DATABASE_URL: postgresql+psycopg://caready:caready@postgres:5432/caready
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: caready
  S3_SECRET_ACCESS_KEY: caready-dev-secret
  S3_BUCKET_PHOTOS: caready-photos
  S3_BUCKET_EXPORTS: caready-exports
  MLFLOW_TRACKING_URI: http://mlflow:5000
  JWT_SECRET: dev-only-change-me
  PII_ENCRYPTION_KEYS: dev-only-insecure-passphrase-change-me
  API_CORS_ORIGINS: http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: caready
      POSTGRES_PASSWORD: caready
      POSTGRES_DB: caready
      # C collation keeps index ordering stable across platform libc versions,
      # which otherwise silently corrupts text indexes on an OS upgrade.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caready -d caready"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: caready
      MINIO_ROOT_PASSWORD: caready-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: create buckets and lock down public access. Photos are only ever
  # served through short-lived signed URLs (§10).
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 caready caready-dev-secret &&
      mc mb --ignore-existing local/caready-photos &&
      mc mb --ignore-existing local/caready-exports &&
      mc anonymous set none local/caready-photos &&
      mc anonymous set none local/caready-exports &&
      echo 'buckets ready'
      "
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5500:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      <<: *python-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      # Live reload in dev. Config is mounted so a rubric change is visible
      # without a rebuild, which is the point of config-driven grading.
      - ./services/api:/app/services/api
      - ./config:/app/config:ro
      - ./seed:/app/seed
    command: >
      sh -c "
      cd /app/services/api &&
      alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      <<: *python-env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./services/api:/app/services/api
      - ./services/worker:/app/services/worker
      - ./packages/ml:/app/packages/ml
      - ./config:/app/config:ro
    command: ["python", "-m", "worker.main"]
    restart: unless-stopped

  # One-shot: populate the database with synthetic data. Runs after the API
  # has applied migrations, so it never races the schema.
  seed:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      <<: *python-env
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./services/api:/app/services/api
      - ./config:/app/config:ro
      - ./seed:/app/seed
    command: ["python", "/app/seed/run_seed.py"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SYNTHETIC_DATA_MODE: "true"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./apps/web:/app/apps/web
      - web-node-modules:/app/apps/web/node_modules
      - ./config:/app/config:ro
    command: ["npm", "run", "dev"]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mlflow-data:
  web-node-modules:
