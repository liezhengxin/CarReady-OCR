/* Brand reference: https://caready.co.id/ — Source Sans Pro, #CF1701 primary,
   #C20102 accent, #1E1E1F text, #F0F2F5 neutral surface. */
:root{--font:'Source Sans Pro',Arial,sans-serif;--primary:#cf1701;--primary-hover:#a61201;--primary-strong:#c20102;--primary-light:#fff0ee;--bg:#f0f2f5;--surface:#fff;--ink:#1e1e1f;--muted:#646566;--border:#dcdde0;--green:#198754;--green-light:#eaf5ef;--warning:#8a5b08;--warning-bg:#fff3cd;--danger:#b4232c;--danger-bg:#fcebed;--blue:#174d7a;--blue-bg:#edf3fa;--sidebar:#fff;--radius:8px;--radius-sm:6px;--shadow:0 .5px 2px #3d4b5c1f,0 0 1px #3d4b5c0d}
body{font-family:var(--font);color:var(--ink)}.mono{font-family:var(--font);font-variant-numeric:tabular-nums}h1{font-weight:700;letter-spacing:-.4px}h2,h3{font-weight:700;letter-spacing:0}.eyebrow{font-weight:600;letter-spacing:.8px}.btn,input,select,textarea{font-family:var(--font)}.btn{border-radius:6px;font-size:16px;font-weight:600}.btn:hover{background:#f0f2f5}.btn.primary,.btn.lime{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover,.btn.lime:hover{background:var(--primary-hover);border-color:var(--primary-hover)}.btn.dark{background:#3c3c3d;border-color:#646566;color:#fff}.btn.dark:hover{background:#4b4b4d}.btn.ghost:hover{background:#f0f2f5}.btn.danger{color:var(--danger)}.badge{font-size:13px;font-weight:600}.badge.outline{color:#fff;border-color:#ffffff55}.badge.green,.grade{color:var(--green);background:var(--green-light)}.grade.c{color:var(--warning);background:var(--warning-bg)}.field input:focus,.control:focus,.field select:focus,.field textarea:focus{outline:2px solid #cf170140;border-color:#e78b80}.file-label:focus-within{outline:2px solid var(--primary)}:focus-visible{outline-color:var(--primary)}.card{border-radius:8px}.metric-label{font-size:16px}.metric-value{font-weight:700}.metric-icon{background:#f0f2f5;color:#646566}.metric.selected{border-color:#eca299;background:#fff8f7}.metric.selected .metric-icon{background:#fce8e5;color:var(--primary)}
.sidebar{background:#fff;color:#646566;border-right:1px solid var(--border)}.side-label{color:#687083;font-size:12px}.navbtn{font-size:16px}.navbtn:hover{background:#f0f2f5}.navbtn.active{background:var(--primary-light);color:var(--primary);font-weight:600;box-shadow:inset 3px 0 var(--primary)}.navbtn .count{color:var(--primary);background:#f5d1cc}.side-note{color:#646566;border-color:var(--border)}.user{border-color:var(--border)}.user-info>div:first-child{color:var(--ink)!important}.avatar{background:#f0f2f5;color:#646566}.brand{padding:0 8px;color:var(--ink)}.brand-logo{display:block;width:164px;height:58px;flex-shrink:0;background:var(--brand-logo) center/contain no-repeat}.topbar{background:#fff}.mobile-logo{letter-spacing:0}.mobile-logo .brand-logo{width:112px;height:40px}.breadcrumb strong{font-weight:600}.inspector-app .brand{padding:0}.inspector-app .brand-logo{width:140px;height:49px}
.spotlight,.price-panel{background:#1e1e1f;border-color:#1e1e1f}.spotlight .muted,.price-panel .muted,.price-panel .kv span:first-child,.range-labels{color:#d1d5dc}.big-price{font-weight:700;letter-spacing:-.6px}.spotlight .btn.dark{background:#3c3c3d;border-color:#646566}.spotlight .btn.dark:hover{background:#4b4b4d}.price-panel .btn.ghost:hover{background:#3c3c3d}.tab{font-size:16px}.tab.active{color:var(--primary-strong);border-bottom:3px solid var(--primary-strong)}td button.rowlink{color:var(--primary-strong);font-size:13px}th{font-size:12px;background:#f8f9fa}tbody tr:hover{background:#f8f9fa}.table-head h2{color:var(--ink)}.table-tools select,.searchbox input,.field,.field input,.field select,.field textarea{font-size:16px}.vehicle-tile{background:#f0f2f5;color:#687083}.score-ring{border-color:#d1e7dd;border-top-color:var(--green);border-right-color:var(--green);border-bottom-color:var(--green);color:var(--green)}.photo-frame{background:#f0f2f5}.photo-frame .icon,.photo-frame .demo-label{color:#687083}.bar{background:#f0f2f5}.bar span{background:#cf1701}.progress{background:#e6e8eb}.progress div{background:var(--primary)}
.step.active{color:var(--primary)}.step.active .step-num{background:var(--primary);border-color:var(--primary);color:#fff}.step.done .step-num{background:var(--green);border-color:var(--green);color:#fff}.capture-dot{background:#e6e8eb}.capture-dot.done{background:var(--green)}.camera-zone,.import-drop{background:#f8f9fa;border-color:#bebfc2}.camera-zone .icon{color:#687083}.angle-btn.active{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary);color:var(--primary);background:var(--primary-light)}.angle-btn.done{color:var(--green);background:var(--green-light)}.angle-btn.done.active{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}.spinner{border-color:#e6e8eb;border-top-color:var(--primary)}dialog{border-radius:12px;box-shadow:0 16px 60px #1e1e1f33}dialog::backdrop{background:#1e1e1f80}.toast{background:#1e1e1f}.notice,.damage{border-radius:8px}
@media(max-width:900px) and (min-width:651px){.sidebar .brand-logo{width:44px;height:44px;background-image:var(--brand-icon)}.sidebar .brand{padding:0}.sidebar .navbtn{padding:13px}}

<script>
'use strict';
const APP_ROLE='admin';

'use strict';
/* CAREADY SINGLE-FILE DEMO. No requests, secrets, dependencies, or backend.

const CONFIG={storageKey:'caready-'+APP_ROLE+'-v2',version:2,scenario:'normal',asOf:'2026-09-15',latency:520,comparableLimit:10};
const Utils={
 esc:v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
 money:v=>'Rp '+Math.round(v).toLocaleString('id-ID'), short:v=>'Rp '+(v/1e6).toFixed(1)+'m', num:v=>v.toLocaleString('en-US'),
 round:v=>Math.round(v/100000)*100000, sleep:ms=>new Promise(r=>setTimeout(r,ms)),
 time:v=>new Date(v).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}),
 quantile:(a,p)=>{const s=[...a].sort((x,y)=>x-y),n=(s.length-1)*p,l=Math.floor(n);return s[l]+(s[Math.ceil(n)]-s[l])*(n-l);},
 icon:(name)=>{const paths={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',car:'<path d="m5 7 2-4h10l2 4 2 3v7H3v-7l2-3Z M5 7h14M6 12h2m8 0h2M5 17v3m14-3v3"/>',camera:'<path d="M8 5 9 3h6l1 2h4a1 1 0 0 1 1 1v13H3V6a1 1 0 0 1 1-1Z"/><circle cx="12" cy="12" r="4"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',back:'<path d="M20 12H4m6-6-6 6 6 6"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',plus:'<path d="M12 5v14M5 12h14"/>',sliders:'<path d="M4 6h9m4 0h3M4 12h3m4 0h9M4 18h11m4 0h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z M8 11l3 3 5-6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',chart:'<path d="M4 3v17h17M8 15l4-5 4 2 5-7"/>',file:'<path d="M14 3H5v18h14V8Zm0 0v5h5M8 12h8m-8 4h6"/>',alert:'<path d="m12 3 10 18H2Z M12 9v5m0 3h.01"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/>',refresh:'<path d="M20 7v5h-5M4 17v-5h5M20 12a8 8 0 0 0-14-6M4 12a8 8 0 0 0 14 6"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/>',pin:'<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2"/>',review:'<path d="M8 3h12v15H8Z M4 7v14h12M11 8h6m-6 4h4"/>'};return '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">'+(paths[name]||paths.file)+'</svg>';}
};
const {esc,money,short,num,icon}=Utils;
// DemoData: deterministic mock inventory and 30 historical auction records.
const DemoData={
 angles:['Front','Front Left','Left','Rear Left','Rear','Rear Right','Right','Front Right'],
 identitySteps:['STNK','Chassis number','Manufacturer / VIN plate','License plate','Odometer'],
 profiles:[{brand:'Toyota',model:'Avanza',variant:'1.5 G CVT',newPrice:255000000,base:182000000},{brand:'Daihatsu',model:'Xenia',variant:'1.5 R CVT',newPrice:247000000,base:169000000},{brand:'Honda',model:'Brio',variant:'Satya E CVT',newPrice:190000000,base:137000000},{brand:'Mitsubishi',model:'Xpander',variant:'Ultimate CVT',newPrice:312000000,base:218000000}],
 findings(high=false){return [{component:'Front bumper',type:'Scratch',severity:high?'Severe':'Moderate',confidence:96,impact:high?4200000:1250000},{component:'Left rear door',type:'Dent',severity:high?'Moderate':'Minor',confidence:91,impact:high?2500000:750000},{component:'Rear bumper',type:'Scratch',severity:'Minor',confidence:94,impact:500000},...(high?[{component:'Right fender',type:'Dent',severity:'Severe',confidence:93,impact:3200000}]:[])];},
 stnk(v){if(v.icr?.stnk?.fields)return {...v.icr.stnk.fields};return {licensePlate:v.plate,owner:'BUDI SANTOSO',address:'Jl. Melati No. 18, Kebayoran Baru, Jakarta Selatan',brand:v.brand,type:v.model+' '+v.variant,model:'Passenger MPV',variant:v.variant,year:v.year,chassis:v.vin,engine:'2NRX'+(583421+v.seed),color:v.color,fuel:'Gasoline',validUntil:'18 May 2027',pkb:3255000,swdkllj:143000,taxDue:'18 May 2027'};},
 vehicle(seed,profile=0){const p=this.profiles[profile],year=[2022,2023,2021,2022,2023,2022,2021,2024][seed%8];return {...p,id:'CR-2609-'+String(142+seed).padStart(4,'0'),seed,plate:['B 2847 SJK','B 1739 PZT','D 1284 AFS','B 2198 UIM','F 1632 QW','B 1975 NKR','D 1873 YTR','B 2061 SZA'][seed%8],year,mileage:[42315,28840,65720,38400,21950,51280,68210,18320][seed%8],vin:profile===0?'MHKM5EB3JNK012345':'MHKM5EB3JNK0'+String(12345+seed),color:seed%2?'Pearl white':'Silver metallic',inspector:'Rizky Pratama',branch:'Jakarta Selatan',created:'2026-09-15T09:'+String(10+seed*3)+':00+07:00',status:['Awaiting Review','Auction Ready','Inspection Completed','Awaiting Review','Auction Ready','Inspection Completed','Awaiting Review','Auction Ready'][seed%8],scenario:seed===6?'mismatch':'normal',findings:this.findings(seed===6),photos:{},audit:[],complete:true};},
 inventory(){return Array.from({length:8},(_,i)=>this.vehicle(i,[0,2,1,0,3,0,1,0][i]));},
 comparables(){return Array.from({length:30},(_,i)=>{const pi=i<18?0:1+Math.floor((i-18)/4),p=this.profiles[pi],year=2021+i%4,mileage=23000+(i*7919)%57000,grade=['A','B','B','C'][i%4],days=12+(i*11)%170;return {id:'AUC-'+(6810+i),brand:p.brand,model:p.model,variant:i%7===0&&pi===0?'1.3 E CVT':p.variant,year,mileage,auctionDate:new Date(Date.parse(CONFIG.asOf)-days*864e5).toISOString().slice(0,10),region:['Jakarta','Bandung','Tangerang','Bekasi'][i%4],auctionPrice:Utils.round(p.base+(year-2022)*9800000-(mileage-40000)*105+((i%5)-2)*1800000-({A:0,B:2500000,C:9000000}[grade])-(i%7===0&&pi===0?9000000:0)),grade};});}
};
const StorageService={warning:'',load(){try{const s=JSON.parse(localStorage.getItem(CONFIG.storageKey));return s?.version===CONFIG.version&&Array.isArray(s.units)?s:null;}catch{return null;}},save(){try{localStorage.setItem(CONFIG.storageKey,JSON.stringify(AppState.data));this.warning='';return true;}catch{this.warning='Changes could not be saved on this device. Keep this tab open and export completed inspections before closing it.';return false;}}};
const AppState={data:StorageService.load()||{version:2,units:APP_ROLE==='admin'?DemoData.inventory():[],scenario:CONFIG.scenario,draft:null},view:APP_ROLE==='admin'?'dashboard':'inspector',tab:'identity',selected:null,filters:{search:'',status:'All statuses',grade:'All grades'},busy:false,quality:'GOOD',captureIndex:0,angleIndex:0,
 get unit(){return this.data.units.find(v=>v.id===this.selected)||this.data.units[0];},save(){if(!StorageService.save())UIComponents.toast(StorageService.warning);},log(v,action,reason='',extra={}){v.audit.unshift({at:new Date().toISOString(),actor:'Dina Putri · Appraiser',action,reason,...extra});this.save();}
};
// Replace these async interfaces with API calls later; user images are not sent anywhere.
const ICRService={async analyzeSTNK(v){await Utils.sleep(CONFIG.latency);return {fields:DemoData.stnk(v),confidence:v.scenario==='low'?68:98.7};},async analyzeChassis(v){await Utils.sleep(CONFIG.latency);return IdentityVerificationService.compare(v);},async analyzeImage(kind,v){if(kind===0)return this.analyzeSTNK(v);if(kind===1||kind===2)return this.analyzeChassis(v);await Utils.sleep(CONFIG.latency);return kind===3?{plate:v.plate,confidence:99}:{mileage:v.mileage,confidence:98};},async checkQuality(result='GOOD'){await Utils.sleep(CONFIG.latency);return {status:result,accepted:result==='GOOD'};}};
const IdentityVerificationService={compare(v){const saved=v.icr?.identity,scenario=v.scenario||'normal',stnk=v.icr?.stnk?.fields?.chassis||v.vin,physical=saved?.physical||(scenario==='mismatch'?v.vin.slice(0,-3)+'987':scenario==='partial'?v.vin.slice(0,-3)+'???':v.vin),plate=Evidence.has(v,'identity',2)?saved?.plate||v.vin:null,confidence=saved?.confidence??(scenario==='low'?68:99.2),numbers=[stnk,physical,...(plate?[plate]:[])],status=confidence<80?'LOW CONFIDENCE':numbers.some(n=>n.includes('?'))?'PARTIAL MATCH':numbers.every(n=>n===stnk)?'MATCH':'MISMATCH';return {stnk,physical,plate,status,confidence};}};
const VisualInspectionService={async analyze(v){await Utils.sleep(CONFIG.latency*2);return DemoData.findings(v.scenario==='damage').map(f=>({...f,confidence:v.scenario==='low'?f.confidence-27:f.confidence}));}};
const ConditionEngine={evaluate(v){const findings=v.findings||[],deduction=findings.reduce((s,f)=>s+f.impact,0);return {grade:deduction>7000000?'C':deduction>0?'B':'A',deduction,findings};},gradeNormalization:{A:0,B:2500000,C:9000000}};
const ComparableEngine={records:DemoData.comparables(),select(v){return this.records.filter(c=>c.brand===v.brand&&c.model===v.model).map(c=>{const days=(Date.parse(CONFIG.asOf)-Date.parse(c.auctionDate))/864e5;const score=40+(c.variant===v.variant?22:8)+15*Math.exp(-Math.abs(c.year-v.year)/2)+13*Math.exp(-Math.abs(c.mileage-v.mileage)/30000)+10*Math.exp(-days/120);const adjusted=c.auctionPrice+ConditionEngine.gradeNormalization[c.grade]+(v.year-c.year)*9800000+(c.mileage-v.mileage)*105+(c.variant===v.variant?0:9000000);return {...c,days,score,adjusted};}).sort((a,b)=>b.score-a.score).slice(0,CONFIG.comparableLimit);},estimate(v){const rows=this.select(v),weights=rows.map(c=>Math.pow(c.score/100,4)),total=weights.reduce((a,b)=>a+b,0),weighted=rows.reduce((s,c,i)=>s+c.adjusted*weights[i],0)/total;return {rows,median:Utils.quantile(rows.map(c=>c.auctionPrice),.5),weighted,stdev:Math.sqrt(rows.reduce((s,c,i)=>s+weights[i]*(c.adjusted-weighted)**2,0)/total),available:this.records.filter(c=>c.brand===v.brand&&c.model===v.model).length};}};
const ValuationEngine={predict(v){const comp=ComparableEngine.estimate(v),age=2026-v.year,ml=v.base-(age-4)*9700000-(v.mileage-40000)*95,market=Utils.round(comp.weighted*.7+ml*.3),spread=Utils.round(Math.max(market*.038,comp.stdev*1.282)),confidence=v.scenario==='low'?67:Math.min(94,82+comp.rows.length);return {comp,ml,market,p10:market-spread,p50:market,p90:market+spread,confidence,newPrice:v.newPrice,depreciation:(1-market/v.newPrice)*100};}};
const AuctionPricingEngine={calculate(v){const valuation=ValuationEngine.predict(v),condition=ConditionEngine.evaluate(v),fair=valuation.market-condition.deduction;return {...valuation,condition,fair,start:Utils.round(fair*.92),hammerLow:valuation.p10-condition.deduction,hammerHigh:valuation.p90-condition.deduction};}};
const UIComponents={
 badge(text,color){return '<span class="badge '+(color||({'MATCH':'green','Auction Ready':'green','Awaiting Review':'amber','Inspection Completed':'blue','MISMATCH':'red','LOW CONFIDENCE':'amber','PARTIAL MATCH':'amber','Review Requested':'amber'}[text]||''))+'">'+esc(text)+'</span>';},
 grade(v){const g=ConditionEngine.evaluate(v).grade;return '<span class="grade '+(g==='C'?'c':'')+'">'+g+'</span>';},
 toast(message){const t=document.getElementById('toast');t.className='toast';t.textContent=message;clearTimeout(this.timer);this.timer=setTimeout(()=>{t.className='';t.textContent='';},4500);},
 modal(title,body,footer=''){const d=document.getElementById('modal');d.innerHTML='<div class="modal-head"><h2>'+esc(title)+'</h2><button class="btn ghost iconbtn" data-action="close-modal" aria-label="Close dialog">'+icon('close')+'</button></div><div class="modal-body">'+body+'</div>'+(footer?'<div class="modal-foot">'+footer+'</div>':'');d.showModal();},
 photo(v,key,label){const p=v.photos?.[key];return '<button class="photo" data-action="photo" data-key="'+key+'" data-id="'+v.id+'"><div class="photo-frame">'+(p?.data?'<img src="'+p.data+'" alt="'+esc(label)+' inspection capture">':icon('camera')+'<span class="demo-label">SAMPLE FRAME</span>')+'</div><div class="photo-caption"><span>'+esc(label)+'</span>'+icon('check')+'</div></button>';},
 findings(v){return '<div class="stack" style="gap:12px">'+(v.findings||[]).map(f=>'<div class="damage"><div class="damage-icon">'+icon('alert')+'</div><div class="damage-body"><div class="between"><span class="damage-title">'+esc(f.component)+'</span>'+this.badge(f.severity,f.severity==='Severe'?'red':'amber')+'</div><div class="damage-meta">'+f.type+' · AI confidence '+f.confidence+'%</div><div class="damage-cost">−'+money(f.impact)+'</div></div></div>').join('')+'</div>';},
 timeline(v){const events=[...v.audit,{at:v.created,actor:v.inspector+' · Inspector',action:'Inspection completed',reason:'STNK, chassis, odometer and eight exterior views captured.'},{at:v.created,actor:v.inspector+' · Inspector',action:'Inspection created',reason:v.branch+' branch'}];return '<div class="timeline">'+events.map(e=>'<div class="event"><div class="event-dot">'+icon('check')+'</div><div><p><strong>'+esc(e.action)+'</strong></p><small>'+esc(Utils.time(e.at))+' · '+esc(e.actor)+'</small>'+(e.reason?'<div class="event-note">'+esc(e.reason)+'</div>':'')+(e.ai!==undefined?'<div class="event-note">AI recommendation: '+money(e.ai)+'\nHuman override: '+money(e.human)+'</div>':'')+'</div></div>').join('')+'</div>';},
 valuationChart(p){const values=p.comp.rows.map(c=>c.adjusted),min=Math.min(...values,p.p10)-3e6,max=Math.max(...values,p.p90)+3e6,x=v=>35+(v-min)/(max-min)*530;return '<svg viewBox="0 0 600 150" class="chart-svg" role="img" aria-label="Normalized comparable auction prices and reference market value"><rect x="'+x(p.p10)+'" y="15" width="'+(x(p.p90)-x(p.p10))+'" height="90" rx="8" fill="#fff0ee"/><line x1="35" y1="105" x2="565" y2="105" stroke="#dcdde0"/>'+values.map((v,i)=>'<circle cx="'+x(v)+'" cy="'+(49+i%3*16)+'" r="5" fill="#c20102" opacity=".8"/>').join('')+'<line x1="'+x(p.market)+'" y1="12" x2="'+x(p.market)+'" y2="105" stroke="#cf1701" stroke-width="2"/>'+[[p.p10,'P10'],[p.market,'P50'],[p.p90,'P90']].map(([v,l])=>'<text x="'+x(v)+'" y="126" text-anchor="middle" fill="#646566" font-size="11">'+l+'</text><text x="'+x(v)+'" y="144" text-anchor="middle" fill="#1e1e1f" font-size="12">'+short(v)+'</text>').join('')+'</svg>';}
};
// Portable inspection format shared by Inspector and Admin. No automatic cross-device sync.
// Stable legacy indices preserve existing inspections: 0 STNK, 1 chassis, 2 optional VIN,
// 3 optional plate close-up, 4 odometer. Required workflow is now [0,1,4] + 8 exterior views.
const Evidence={
 required:[0,1,4],
 has(v,type,i){return !!v.photos?.[type+'-'+i];},
 identityDone(v){return this.required.every(i=>this.has(v,'identity',i));},
 requiredCount(v){return this.required.filter(i=>this.has(v,'identity',i)).length+DemoData.angles.filter((_,i)=>this.has(v,'exterior',i)).length;},
 count(v){return Object.keys(v.photos||{}).length;},
 optional(v){return [2,3].filter(i=>this.has(v,'identity',i));},
 complete(v){return this.requiredCount(v)===11&&(!v.plateNeedsCloseup||this.has(v,'identity',3));},
 plateSource(v){return this.has(v,'identity',3)?'identity-3':'exterior-0';},
 sourceLabel(v){return this.plateSource(v)==='identity-3'?'License plate close-up':'Front exterior photo';},
 migrate(v){v.photos=v.photos||{};if(v.complete&&Object.keys(v.photos).length===0&&/^CR-2609-\d+$/.test(v.id)){for(const i of this.required)v.photos['identity-'+i]={source:'demo',quality:'GOOD',captured:v.created};for(let i=0;i<8;i++)v.photos['exterior-'+i]={source:'demo',quality:'GOOD',captured:v.created};}v.identityCaptured=[0,1,2,3,4].filter(i=>this.has(v,'identity',i));v.exteriorCaptured=DemoData.angles.map((_,i)=>i).filter(i=>this.has(v,'exterior',i));v.evidenceVersion=2;if(v.icr?.plate)v.icr.plate.source=this.plateSource(v);return v;},
 refreshPlate(v){v.icr=v.icr||{};v.icr.plate={plate:v.plate,confidence:v.scenario==='low'?68:99,source:this.plateSource(v)};}
};

const InspectionResults={
 newId(){const stamp=new Date().toISOString().slice(0,10).replaceAll('-','');const suffix=typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID().replaceAll('-','').slice(0,12):Date.now().toString(36)+Math.random().toString(36).slice(2,8);return 'CR-'+stamp+'-'+suffix.toUpperCase();},
 ensure(v,refresh=false){Evidence.migrate(v);const clean={...v};delete clean.icr;const conf=v.scenario==='low'?68:98.7,existing=refresh?{}:(v.icr||{});v.icr={stnk:existing.stnk||{fields:DemoData.stnk(clean),confidence:conf},identity:IdentityVerificationService.compare(refresh?clean:v),plate:{...(existing.plate||{plate:v.plate,confidence:v.scenario==='low'?68:99}),source:Evidence.plateSource(v)},odometer:existing.odometer||{mileage:v.mileage,confidence:v.scenario==='low'?68:98},analyzedAt:existing.analyzedAt||new Date().toISOString(),provider:'caready-demo'};return v.icr;}
};
const TransferService={
 format:'caready.inspection',version:2,maxBytes:35*1024*1024,
 serialize(v){if(!v.complete||!Evidence.complete(v))throw new Error('Complete all capture steps before exporting.');InspectionResults.ensure(v);return JSON.stringify({format:this.format,version:this.version,exportedAt:new Date().toISOString(),inspection:v},null,2);},
 validate(text){
 if(typeof text!=='string'||text.length>this.maxBytes)throw new Error('Choose an inspection file under 35 MB.');
 let packet;try{packet=JSON.parse(text);}catch{throw new Error('The file is not valid JSON. Export it again from Inspector.');}
 const fail=msg=>{throw new Error(msg);};
 const object=(v,name)=>{if(!v||typeof v!=='object'||Array.isArray(v))fail('Missing or invalid '+name+'.');return v;};
 const str=(v,name,max=250)=>{if(typeof v!=='string'||!v.trim()||v.length>max||/[\u0000-\u001f<>]/.test(v))fail('Invalid '+name+'.');return v;};
 const number=(v,name,min=0,max=1e9)=>{if(typeof v!=='number'||!Number.isFinite(v)||v<min||v>max)fail('Invalid '+name+'.');return v;};
 const date=(v,name)=>{str(v,name,50);if(!Number.isFinite(Date.parse(v)))fail('Invalid '+name+'.');return v;};
 const choice=(v,values,name)=>{if(!values.includes(v))fail('Invalid '+name+'.');return v;};
 object(packet,'inspection package');if(packet.format!==this.format||![1,2].includes(packet.version))fail('Unsupported file. Select a Caready Inspector export.');date(packet.exportedAt,'export date');

 timeline(v){return `<section class="card pad"><h2>Inspection record</h2><dl class="definition section-note"><div><dt>Inspector</dt><dd>${esc(v.inspector)}</dd></div><div><dt>Branch</dt><dd>${esc(v.branch)}</dd></div><div><dt>Inspection date</dt><dd>${esc(Utils.time(v.completedAt||v.created))}</dd></div><div><dt>Source</dt><dd>${v.importedAt?'Imported inspection':'Sample inspection'}</dd></div></dl></section><section class="card pad"><h2>Activity log</h2>${UIComponents.timeline(v)}</section>`;}
};
const ReviewActions={ review(kind){const v=AppState.unit,p=AuctionPricingEngine.calculate(v);if(kind==='accept'){if(IdentityVerificationService.compare(v).status!=='MATCH'){UIComponents.toast('Identity verification must pass before auction approval.');return;}UIComponents.modal('Accept auction recommendation','<p style="font-size:14px">Approve '+esc(v.plate)+' for auction at the '+(v.override?'human-approved':'recommended')+' starting price.</p><div class="notice green"><div class="kv"><span>Starting price</span><b>'+money(v.override?.amount??p.start)+'</b></div><div class="kv"><span>Fair auction value</span><b>'+money(p.fair)+'</b></div></div>','<button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="confirm-accept">Approve for auction</button>');}else{const override=kind==='override';UIComponents.modal(override?'Override starting price':'Request review','<p class="muted" style="font-size:14px">'+(override?'Enter a revised starting price and reason. The original recommendation remains in the audit log.':'Enter the issue that requires review. Your reason will be recorded in the inspection history.')+'</p>'+(override?'<div class="notice"><div class="kv"><span>AI recommendation</span><b>'+money(p.start)+'</b></div></div><label class="field">Revised starting price · IDR<input id="override-amount" type="number" min="100000" max="1000000000" step="100000" value="'+(v.override?.amount??p.start)+'" required></label>':'')+'<label class="field">Reason <textarea id="review-reason" required maxlength="1000" placeholder="Enter the reason for this decision"></textarea></label><p id="form-error" role="alert" style="color:var(--danger);font-size:14px"></p>','<button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="save-review" data-kind="'+kind+'">'+(override?'Save override':'Request review')+'</button>');}},
 saveReview(kind){const v=AppState.unit,reason=document.getElementById('review-reason').value.trim(),error=document.getElementById('form-error');if(reason.length<5){error.textContent='Please enter a reason with at least 5 characters.';document.getElementById('review-reason').focus();return;}if(kind==='override'){const input=document.getElementById('override-amount'),amount=Number(input.value);if(!input.checkValidity()||!Number.isFinite(amount)){error.textContent='Enter an amount from Rp 100,000 to Rp 1bn, in Rp 100,000 increments.';return;}const ai=AuctionPricingEngine.calculate(v).start;v.override={amount,reason,ai,at:new Date().toISOString()};v.status='Awaiting Review';AppState.log(v,'Starting price overridden',reason,{ai,human:amount});}else{v.status='Review Requested';AppState.log(v,'Human review requested',reason);}AppState.save();document.getElementById('modal').close();Router.render();UIComponents.toast(kind==='override'?'Starting price updated. Appraiser approval required.':'Inspection moved to the review queue.');}
};
const Router={go(view,id){if(!['dashboard','detail'].includes(view))return;if(id&&!AppState.data.units.some(v=>v.id===id))return;AppState.view=view;if(id)AppState.selected=id;AppState.tab='identity';this.render();window.scrollTo({top:0});},render(){document.getElementById('app').innerHTML=Shell.render();if(AppState.view==='dashboard')DashboardView.renderRows();}};
const Shell={render(){return '<aside class="sidebar"><div class="brand"><span class="brand-logo" role="img" aria-label="Caready Auction"></span></div><div class="side-label">ADMIN WORKSPACE</div><nav class="side-nav" aria-label="Admin navigation"><button class="navbtn '+(AppState.view==='dashboard'?'active':'')+'" data-action="dashboard">'+icon('grid')+'<span>Overview</span></button><button class="navbtn '+(AppState.view==='detail'?'active':'')+'" data-action="inventory">'+icon('car')+'<span>Vehicle inventory</span><span class="count">'+AppState.data.units.length+'</span></button><button class="navbtn" data-action="review-queue">'+icon('review')+'<span>Review queue</span></button><button class="navbtn" data-action="import-open">'+icon('upload')+'<span>Import inspection</span></button></nav><div class="side-bottom"><button class="navbtn" data-action="demo">'+icon('sliders')+'<span>Demo controls</span></button><div class="side-note">DEMO WORKSPACE<br>Sample data · Simulated analysis</div><div class="user"><span class="avatar">DP</span><div class="user-info"><div style="font-size:13px;color:white">Dina Putri</div><div class="small">Admin · Appraiser</div></div></div></div></aside><div class="workspace"><header class="topbar"><div class="mobile-logo"><span class="brand-logo" role="img" aria-label="Caready Auction"></span></div><div class="breadcrumb">Admin <span>/</span><strong>'+(AppState.view==='detail'?'Vehicle detail':'Overview')+'</strong></div><div class="flex"><button class="btn" data-action="import-open">'+icon('upload')+' Import inspection</button><button class="btn ghost iconbtn mobile-only" data-action="demo" aria-label="Demo controls">'+icon('sliders')+'</button><span class="avatar">DP</span></div></header>'+(StorageService.warning?'<div class="storage-warning">'+esc(StorageService.warning)+'</div>':'')+'<main class="content">'+(AppState.view==='dashboard'?DashboardView.render():DetailView.render())+'</main></div>';}};
const ImportView={pending:null,
 open(){this.pending=null;UIComponents.modal('Import inspection','<p class="muted">Select a JSON file exported from Caready Inspector. Review the vehicle details before adding it to inventory.</p><div class="import-drop">'+icon('upload')+'<label class="btn primary file-label">Choose inspection file<input type="file" id="import-file" accept=".json,application/json" aria-label="Choose inspection JSON"></label><p class="small muted">Photos and ICR results included · Up to 35 MB</p></div><div id="import-status" role="status" aria-live="polite"></div>','<button class="btn" data-action="close-modal">Cancel</button>');},
 async stageFile(file){if(!file)return;const status=document.getElementById('import-status');status.textContent='Checking inspection file…';try{if(file.size>TransferService.maxBytes)throw new Error('Choose an inspection file under 35 MB.');const text=await file.text();if(!document.getElementById('modal').open)return;this.stage(text);}catch(e){this.pending=null;status.className='import-error';status.textContent=e.message;}},
 stage(text){const v=TransferService.validate(text),existing=AppState.data.units.find(u=>u.id===v.id);this.pending=existing?null:v;if(existing){UIComponents.modal('Inspection already exists','<p>This inspection is already in inventory. Its photos, analysis and appraisal decisions have not been changed.</p><div class="notice"><strong>'+esc(existing.brand+' '+existing.model)+'</strong><br>'+esc(existing.plate)+'<br><span class="mono small">'+esc(existing.id)+'</span></div>','<button class="btn" data-action="close-modal">Close</button><button class="btn primary" data-action="view-existing" data-id="'+existing.id+'">View existing inspection</button>');return {duplicate:true,id:v.id};}
 const uploaded=Object.values(v.photos).filter(p=>p.source==='upload').length;UIComponents.modal('Review inspection import','<div><h2>'+esc(v.brand+' '+v.model)+'</h2><p class="muted">'+esc(v.variant)+' · '+v.year+'</p><p style="margin-top:8px">'+esc(v.plate)+' · '+num(v.mileage)+' km</p><p class="mono small muted" style="margin-top:7px;overflow-wrap:anywhere">'+esc(v.id)+'</p></div><div class="import-meta">'+UIComponents.badge(Evidence.count(v)+' captures','green')+UIComponents.badge(v.icr.identity.status)+'</div><dl class="definition"><div><dt>Inspector</dt><dd>'+esc(v.inspector)+'</dd></div><div><dt>Branch</dt><dd>'+esc(v.branch)+'</dd></div><div><dt>STNK confidence</dt><dd>'+v.icr.stnk.confidence+'%</dd></div><div><dt>Photo files</dt><dd>'+uploaded+' uploaded · '+(Evidence.count(v)-uploaded)+' samples</dd></div></dl><div class="notice">Photos, ICR results and inspection history will be retained. The vehicle will enter the appraisal queue with a newly calculated valuation.</div>','<button class="btn" data-action="close-modal">Cancel</button><button class="btn primary" data-action="confirm-import">Import inspection</button>');return {duplicate:false,id:v.id};},
 confirm(){const v=this.pending;if(!v)return;if(AppState.data.units.some(u=>u.id===v.id)){this.pending=null;UIComponents.toast('This inspection is already in inventory.');return;}v.importedAt=new Date().toISOString();v.audit.unshift({at:v.importedAt,actor:'Dina Putri · Appraiser',action:'Inspection imported',reason:'Inspector photos and ICR results retained. Awaiting appraisal.'});AppState.data.units.unshift(v);AppState.save();this.pending=null;document.getElementById('modal').close();Router.go('detail',v.id);AppState.tab='identity';Router.render();UIComponents.toast('Inspection imported. Ready for appraisal.');}
};
function showPhoto(id,key){const v=AppState.data.units.find(v=>v.id===id);if(!v)return;const p=v.photos[key],i=Number(key.split('-')[1]),label=(key.startsWith('identity')?DemoData.identitySteps:DemoData.angles)[i];UIComponents.modal(label+' · '+v.plate,p?.data?'<img class="modal-photo" src="'+p.data+'" alt="'+esc(label)+' capture">':'<div class="camera-zone">'+icon('camera')+'<h3>'+esc(label)+'</h3><p>Sample frame</p></div>');}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;switch(b.dataset.action){
case 'dashboard':Router.go('dashboard');break;
case 'inventory':AppState.filters.status='All statuses';Router.go('dashboard');document.querySelector('.table-head')?.scrollIntoView({behavior:'smooth'});break;
case 'review-queue':AppState.filters={search:'',status:'Needs review',grade:'All grades'};Router.go('dashboard');document.querySelector('.table-head')?.scrollIntoView({behavior:'smooth'});break;
case 'detail':Router.go('detail',b.dataset.id);if(DetailView.sections.some(([id])=>id===b.dataset.tab)){AppState.tab=b.dataset.tab;Router.render();}break;
case 'tab':AppState.tab=b.dataset.tab;Router.render();break;
case 'clear-filters':AppState.filters={search:'',status:'All statuses',grade:'All grades'};Router.render();break;
case 'import-open':ImportView.open();break;
case 'confirm-import':ImportView.confirm();break;
case 'view-existing':document.getElementById('modal').close();Router.go('detail',b.dataset.id);break;
case 'close-modal':ImportView.pending=null;document.getElementById('modal').close();break;
case 'demo':DemoControls.open();break;
case 'apply-demo':DemoControls.apply();break;
case 'reset-confirm':document.getElementById('modal').close();DemoControls.resetPrompt();break;
case 'reset':DemoControls.reset();break;
case 'accept':ReviewActions.review('accept');break;
case 'override':ReviewActions.review('override');break;
case 'request-review':ReviewActions.review('request');break;
case 'save-review':ReviewActions.saveReview(b.dataset.kind);break;
case 'confirm-accept':{const v=AppState.unit;if(IdentityVerificationService.compare(v).status!=='MATCH')return;v.status='Auction Ready';AppState.log(v,'Approved for auction','Starting price '+money(v.override?.amount??AuctionPricingEngine.calculate(v).start)+(v.override?' · Appraiser override accepted':' · AI recommendation accepted'));document.getElementById('modal').close();Router.render();UIComponents.toast('Vehicle approved for auction.');break;}
case 'photo':showPhoto(b.dataset.id,b.dataset.key);break;
}});
document.addEventListener('input',e=>{if(e.target.id==='search'){AppState.filters.search=e.target.value;DashboardView.renderRows();}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='status-filter'){AppState.filters.status=t.value;DashboardView.renderRows();}if(t.id==='grade-filter'){AppState.filters.grade=t.value;DashboardView.renderRows();}if(t.id==='import-file')ImportView.stageFile(t.files[0]);});
document.getElementById('modal').addEventListener('cancel',()=>{ImportView.pending=null;});

AppState.data.units.forEach(v=>InspectionResults.ensure(v));if(AppState.data.draft)Evidence.migrate(AppState.data.draft);
Router.render();
</script>
</body>
</html>
