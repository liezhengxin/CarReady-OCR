*{box-sizing:border-box}
.card,.stack,.detail-aside{min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;font-family:var(--font)}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
h1,h2,h3,p{margin:0}
h1{font-size:30px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:700}
small,.small{font-size:12px}
:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

svg.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.muted{color:var(--muted)}
.mono{font-family:var(--font);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.flex{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:16px}
.stack{display:grid;gap:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.nowrap{white-space:nowrap}

.btn{border:1px solid var(--border);border-radius:6px;background:#fff;color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;
  font-weight:600;font-size:16px;min-height:44px;transition:background .15s,transform .15s}
.btn:hover:not(:disabled){background:#f0f2f5}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.dark{background:#3c3c3d;border-color:#646566;color:#fff}
.btn.dark:hover{background:#4b4b4d}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:#f0f2f5}
.btn.danger{color:var(--danger)}
.iconbtn{width:44px;padding:10px}

.badge{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:4px 8px;

.badge.green{background:var(--green-light);color:var(--green)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}

.notice{padding:13px 16px;border-radius:8px;background:var(--blue-bg);color:var(--blue);font-size:14px}
.notice.amber{background:var(--warning-bg);color:var(--warning)}
.notice.green{background:var(--green-light);color:var(--green)}
.notice.red{background:var(--danger-bg);color:var(--danger)}

/* ---------- Sidebar ---------- */
.sidebar{width:222px;position:fixed;inset:0 auto 0 0;background:var(--sidebar);color:var(--muted);
  border-right:1px solid var(--border);padding:30px 18px;display:flex;flex-direction:column;z-index:20}
.brand{padding:0 8px;color:var(--ink);display:flex;align-items:center}
.brand-logo{display:block;width:164px;height:58px;flex-shrink:0;
  background:var(--brand-logo) center/contain no-repeat}
.side-label{font-size:12px;letter-spacing:1.5px;padding:40px 14px 12px;color:#687083}
.navbtn{display:flex;align-items:center;gap:12px;background:none;border:0;color:inherit;
  padding:13px 14px;border-radius:8px;font-size:16px;text-align:left;width:100%;margin:3px 0}
.navbtn:hover{background:#f0f2f5}
.navbtn.active{background:var(--primary-light);color:var(--primary);font-weight:600;
  box-shadow:inset 3px 0 var(--primary)}
.navbtn .count{margin-left:auto;background:#f0f2f5;color:var(--muted);border-radius:4px;
  padding:0 6px;font-size:12px;font-weight:600}
.navbtn.active .count{color:var(--primary);background:#f5d1cc}
.side-bottom{margin-top:auto}
.user{display:flex;align-items:center;gap:10px;padding:16px 8px 0;border-top:1px solid var(--border)}
.avatar{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;
  background:#f0f2f5;color:var(--muted);font-size:12px;font-weight:700;flex-shrink:0}

/* ---------- Workspace ---------- */
.workspace{margin-left:222px}
.topbar{height:78px;padding:0 36px;border-bottom:1px solid var(--border);background:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:15}
.breadcrumb{font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:center}
.breadcrumb strong{color:var(--ink);font-weight:600}
.content{max-width:1640px;margin:auto;padding:32px 36px 48px}
.pagehead{margin-bottom:25px}
.pagehead p{color:var(--muted);font-size:14px;margin-top:7px}
.mobile-logo{display:none}
.mobile-only{display:none}

/* ---------- Metrics ---------- */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.metric{padding:20px 22px}
.metric-label{font-size:16px;color:var(--muted)}
.metric-value{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1.2;margin:14px 0 8px}
.metric-foot{font-size:12px;color:var(--muted)}
.metric-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;
  background:#f0f2f5;color:var(--muted)}
.metric.selected{border-color:#eca299;background:#fff8f7}
.metric.selected .metric-icon{background:#fce8e5;color:var(--primary)}

/* ---------- Insight ---------- */
.insight-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:28px}
.spotlight{background:#1e1e1f;border-color:#1e1e1f;color:#fff;overflow:hidden}
.spotlight .muted{color:#d1d5dc}
.spotlight-main{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:16px;padding-top:22px}
.big-price{font-size:36px;font-weight:700;letter-spacing:-.6px;line-height:1.2}
.mini-chart{width:100%;height:98px}
.range-labels{display:flex;justify-content:space-between;color:#d1d5dc;font-size:12px}
.review-item{padding:16px 0;border-bottom:1px solid var(--border)}
.review-item:last-child{border-bottom:0;padding-bottom:0}
.review-item p{font-size:12px;color:var(--muted);margin-top:3px}

/* ---------- Table ---------- */
.table-head{padding:21px 24px;border-bottom:1px solid var(--border)}
.table-tools{padding:16px 24px;display:flex;gap:12px}
.searchbox{display:flex;align-items:center;border:1px solid var(--border);padding:0 12px;
  border-radius:8px;max-width:380px;flex:1;color:var(--muted);gap:8px}
.searchbox input{width:100%;border:0;background:none;outline:none;font-size:16px;padding:11px 0;min-width:0}
.table-tools select{width:auto;min-width:146px;border:1px solid var(--border);border-radius:8px;
  background:#fff;padding:11px 12px;color:var(--ink);font-size:16px;min-height:44px}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:14px;text-align:left}
th{font-size:12px;text-transform:uppercase;letter-spacing:.65px;color:var(--muted);background:#f8f9fa;
  font-weight:600;padding:12px 16px;border-block:1px solid var(--border)}
td{padding:17px 16px;border-bottom:1px solid #e6e8eb;vertical-align:middle}
th:first-child,td:first-child{padding-left:24px}
tbody tr:hover{background:#f8f9fa}
td small{display:block;color:var(--muted);margin-top:4px}
td button.rowlink{border:0;background:none;color:var(--primary-strong);font-size:13px;font-weight:600;
  padding:0;text-align:left;min-height:32px}
.table-footer{padding:14px 24px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}

/* ---------- Tabs & detail ---------- */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);overflow:auto;margin-bottom:24px}
.tab{white-space:nowrap;border:0;background:none;padding:14px 0;border-bottom:3px solid transparent;
  color:var(--muted);font-size:16px;font-weight:600}

.unit-detail .pagehead{align-items:flex-start;margin-bottom:18px}
.section-note{margin-top:14px}

/* Two columns: evidence scrolls on the left, the decision stays put on the
   right. The question "should I approve this?" should never require a scroll. */
.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.detail-main{order:1;display:grid;gap:16px;min-width:0}
.detail-aside{order:2;position:sticky;top:98px;display:grid;gap:16px;min-width:0}
.pad-sm{padding:18px}
.score-ring.sm{width:64px;height:64px;border-width:5px;font-size:26px}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:14px;margin:13px 0}
.kv span:first-child{color:var(--muted)}
.kv b{text-align:right}
.pills{display:flex;gap:8px;flex-wrap:wrap}

.price-panel{background:#1e1e1f;color:#fff;border-color:#1e1e1f}
.price-panel .muted,.price-panel .kv span:first-child{color:#d1d5dc}
.price-panel .line{background:#ffffff26}
.price-panel .btn{width:100%}
.price-panel .big-price{margin:10px 0 6px}

.score-ring{border:7px solid #d1e7dd;border-top-color:var(--green);border-right-color:var(--green);

  place-items:center;flex-shrink:0;font-size:40px;font-weight:700;color:var(--green)}
.score-ring[data-g="C"]{border-color:#f5e3b8;border-top-color:var(--warning);
  border-right-color:var(--warning);color:var(--warning)}
.score-ring[data-g="D"],.score-ring[data-g="E"]{border-color:#f3cfd3;border-top-color:var(--danger);
  border-right-color:var(--danger);color:var(--danger)}
.reason-list{margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:14px}
.reason-list li{margin:7px 0}

.damage{display:flex;gap:14px;align-items:flex-start;padding:18px;border:1px solid var(--border);border-radius:8px}
.damage-icon{background:var(--warning-bg);color:var(--warning);padding:10px;border-radius:9px;display:flex}
.damage-icon[data-s="1"]{background:var(--green-light);color:var(--green)}
.damage-icon[data-s="3"]{background:var(--danger-bg);color:var(--danger)}
.damage-body{flex:1;min-width:0}
.damage-title{font-weight:600;font-size:14px}
.damage-meta{color:var(--muted);font-size:12px;margin:5px 0 10px}
.damage-cost{font-size:14px;font-weight:600;color:var(--warning)}

.evidence-row{display:flex;align-items:center;justify-content:space-between;gap:18px;
  padding:16px 0;border-bottom:1px solid var(--border)}
.evidence-row:last-child{border-bottom:0}
.evidence-row>div{min-width:0}
.evidence-value{font-size:15px;margin-top:5px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}

.timeline{margin-top:20px}
.event{display:flex;gap:14px;padding-bottom:24px;position:relative}
.event:before{content:"";position:absolute;width:1px;background:var(--border);top:24px;bottom:0;left:12px}
.event:last-child:before{display:none}
.event-dot{width:25px;height:25px;border-radius:50%;background:var(--green-light);color:var(--green);
  display:grid;place-items:center;flex-shrink:0}
.event-dot .icon{width:14px;height:14px}
.event p{font-size:14px}
.event small{color:var(--muted)}
.event-note{padding:10px;background:#f8f9fa;border-radius:6px;margin-top:7px;font-size:12px}

/* ---------- ICR confidence ---------- */
.conf{display:flex;align-items:center;gap:8px;min-width:130px}
.bar{height:5px;background:#f0f2f5;border-radius:10px;overflow:hidden;flex:1}
.bar span{height:100%;display:block;background:var(--green);border-radius:10px}
tr[data-low="true"]{background:var(--warning-bg)}
tr[data-low="true"] .bar span{background:var(--warning)}
.conf-v{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;width:38px;text-align:right}
.val{overflow-wrap:anywhere;white-space:normal}
.mini-btn{border:1px solid var(--border);background:#f8f9fa;border-radius:5px;padding:2px 7px;
  font-size:12px;font-weight:600;color:var(--muted);min-height:26px}
.mini-btn:hover{border-color:var(--primary);color:var(--primary)}

.diff{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;overflow-x:auto}
.diff-label{color:var(--muted);font-size:12px;white-space:nowrap}
.diff-chars{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px;letter-spacing:.06em}
.diff-chars i{font-style:normal;padding:0 .04em;border-radius:3px}
.diff-chars i[data-d="bad"]{background:var(--danger);color:#fff;font-weight:700}
.diff-chars i[data-d="norm"]{background:var(--warning-bg);color:var(--warning);font-weight:700;
  box-shadow:inset 0 -2px 0 currentColor}

/* ---------- Rubric ---------- */
.pt-grid{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 10px;align-items:center;font-size:14px}
.pt-grid .hd{font-size:12px;letter-spacing:.65px;text-transform:uppercase;color:var(--muted);
  font-weight:600;text-align:center}
.pt-grid input{width:64px;text-align:right;font-variant-numeric:tabular-nums;border:1px solid var(--border);
  border-radius:6px;padding:8px 10px;min-height:40px;font-size:15px}
.pt-grid input:disabled{background:#f8f9fa;opacity:.6}
.pt-grid .dmg-note{grid-column:1/-1;font-size:12px;color:var(--muted);margin:-2px 0 8px}
.shift{font-weight:600}
.shift[data-dir="worse"]{color:var(--danger)}
.shift[data-dir="better"]{color:var(--green)}

/* ---------- Responsive ---------- */
@media(min-width:1550px){.content,.topbar{padding-inline:48px}}

  .table-tools select{min-width:0;flex:1}
  .table-footer{padding:14px 16px;flex-wrap:wrap;gap:8px}
  .grid2{grid-template-columns:1fr}
  .tabs{gap:20px}
  .detail-aside{grid-template-columns:1fr}
}

<script>
"use strict";

/* Without caready-store.js the dashboard cannot read submitted units at all,
   so this fails at boot rather than mid-interaction. Make the cause legible. */
if(typeof CareadyStore === "undefined" || typeof CareadyPhotos === "undefined"){
  document.addEventListener("DOMContentLoaded", ()=>{
    const bar = document.createElement("div");
    bar.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:999;background:#b4232c;"
      + "color:#fff;padding:.7rem 16px;font:600 .88rem/1.45 system-ui,sans-serif";
    bar.textContent = "caready-store.js tidak termuat. Unit hasil inspeksi tidak akan muncul. "
      + "Pastikan file itu ada di folder yang sama dengan dashboard.html.";
    document.body.prepend(bar);
  });
  console.error("caready-store.js missing: CareadyStore/CareadyPhotos undefined");
}

function areaMultiplier(r){
  if(r==null) return 1;
  const bp = RUBRIC.areaBreakpoints;
  if(r<=bp[0][0]) return bp[0][1];
  for(let i=0;i<bp.length-1;i++){
    const [x0,y0]=bp[i],[x1,y1]=bp[i+1];
    if(r<=x1) return y0+(y1-y0)*((r-x0)/(x1-x0));
  }
  return bp[bp.length-1][1];
}
function bandFor(s){ for(const b of RUBRIC.bands){ if(b.max===null||s<=b.max) return b; } }
const BAND_ORDER = RUBRIC.bands.map(b=>b.label);
const worseOf = (a,b)=>BAND_ORDER.indexOf(a)>=BAND_ORDER.indexOf(b)?a:b;

function dedupe(dmg){
  const best = new Map();
  for(const d of dmg){
    const k = d.panel+"|"+d.type, cur = best.get(k);
    if(!cur || d.sev>cur.sev || (d.sev===cur.sev && (d.area||0)>(cur.area||0))) best.set(k,d);
  }
  return [...best.values()];
}
function computeGrade(damages){
  const kept = dedupe(damages.filter(d=>(d.conf??1)>=RUBRIC.minConfidence));
  const rows = kept.map(d=>{
    const base = RUBRIC.basePoints[d.type][d.sev];
    const pw = RUBRIC.panelWeights[d.panel] ?? 1;
    const am = areaMultiplier(d.area);
    return {...d, base, pw, am, points: base*pw*am};
  }).sort((a,b)=>b.points-a.points);
  const score = rows.reduce((s,r)=>s+r.points,0);
  const pre = bandFor(score).label;
  let label = pre; const applied = [];
  for(const rule of RUBRIC.downgrades){
    if(rule.test(kept)){ applied.push(rule); label = worseOf(label, rule.cap); }
  }
  return {score, rows, pre, label, applied, band: RUBRIC.bands.find(b=>b.label===label)};
}

const PRICING = {
  p30:-.072, p70:.078, referenceScore:12,
  damageSensitivity:.0045, damageFloor:.55, celahExtra:.955,
  taxPenalty:{ACTIVE:0, EXPIRING_SOON:0, EXPIRED_LT_12M:1_500_000, EXPIRED_GTE_12M:4_500_000}
};
function conditionEffect(score, hasCelah){
  let e = Math.max(PRICING.damageFloor, 1 - PRICING.damageSensitivity*score);
  if(hasCelah) e *= PRICING.celahExtra;
  return e;
}
function priceUnit(u, grade){
  const hasCelah = grade.rows.some(r=>r.type==="celah_panel");
  const anchored = u.otr * u.anchor;
  const ref = anchored * conditionEffect(PRICING.referenceScore, false);
  const act = anchored * conditionEffect(grade.score, hasCelah) - (PRICING.taxPenalty[u.tax] ?? 0);
  const amp  = Math.round(ref/100000)*100000;
  const base = Math.round(act*(1+PRICING.p30)/100000)*100000;
  return {amp, base, p30:base, p50:Math.round(act/100000)*100000,
    p70:Math.round(act*(1+PRICING.p70)/100000)*100000, deduction:amp-base};
}

/* Units submitted by the inspector app arrive through the shared store. They
   are prepended so the newest inspection is the first thing on the page.
   `let`, not `const`: the list is rebuilt whenever the store changes. */
let UNITS = SEEDED_UNITS;

/* Units arrive from another client, so this is the boundary where their shape
   is guaranteed rather than assumed. A DRAFT carries no damages array at all -
   vision has not run - and every render path downstream expects one. */
function normaliseUnit(u){
  return {
    ...u,
    damages:   Array.isArray(u.damages) ? u.damages : [],
    checklist: (u.checklist && typeof u.checklist === "object") ? u.checklist : {},
    status:    STATUS_RANK[u.status] !== undefined ? u.status : "DRAFT",
    defect:    u.defect ?? null,
    /* Everything an ICR read would have produced. Absent on a DRAFT, and
       absent is not the same as empty - the renderers show a dash. */
    ...Object.fromEntries(["merk","model","trim","trans","cc","colour","fuel","branch",
      "otr","anchor","tax","taxUntil","pemilik","alamat","rangka","mesin","bpkb",
      "platRangka","platMesin","plateCond","tipeRaw"].map(k=>[k, u[k] ?? null]))
  };
}

function rebuildUnits(){
  const stored = CareadyStore.units().map(normaliseUnit);
  const storedCodes = new Set(stored.map(u=>u.code));
  UNITS = [...stored, ...SEEDED_UNITS.filter(u=>!storedCodes.has(u.code))];
  UNITS.forEach(u=>{ if(!App.baseline.has(u.code)) App.baseline.set(u.code, computeGrade(u.damages)); });
  return UNITS;
}

  let h = 2166136261;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function confidenceFor(u, f){
  if(u.confOverride && u.confOverride[f.key] != null) return u.confOverride[f.key];
  return Math.min(.995, f.min + .035 + ((hashSeed(u.code+":"+f.key) % 1000)/1000)*.07);
}
const icrRows = u => ICR_FIELDS.map(f=>{
  const conf = confidenceFor(u,f);
  return {field:f, value:String(f.get(u)), conf, low: conf < f.min};
});

/* ==========================================================================
   Cross-checks
   ========================================================================== */
const NORMALISE = {O:"0", I:"1", Q:"0"};
const norm = s => (s||"").toUpperCase().replace(/[\s\-.\/\\*#]/g,"").replace(/[OIQ]/g,c=>NORMALISE[c]);

function editDistance(a,b){
  const m=a.length,n=b.length;
  let prev=Array.from({length:n+1},(_,i)=>i), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function diffChars(a,b){
  const out=[], len=Math.max(a.length,b.length);
  for(let i=0;i<len;i++){
    const ca=a[i]??"·", cb=b[i]??"·";
    out.push({c:cb, d: ca===cb ? "same" : norm(ca)===norm(cb) ? "norm" : "bad"});
  }
  return out;
}

const VERDICT_LABEL = {PASS:"Cocok", NEEDS_REVIEW:"Perlu ditinjau", MISMATCH:"Tidak cocok"};
const SEV_BADGE = {INFO:"green", WARNING:"amber", BLOCKER:"red"};
const PLATE_LABEL = {CLEAN:"Bersih",RUST_LIGHT:"Karat ringan",RUST_HEAVY:"Karat berat",
  REPAINTED:"Dicat ulang",SCRATCHED_OVER:"Tergores menutup",
  TAMPERED_SUSPECTED:"Diduga dimanipulasi",ILLEGIBLE:"Tidak terbaca"};
const TAX_LABEL = {ACTIVE:"Aktif",EXPIRING_SOON:"Akan jatuh tempo",
  EXPIRED_LT_12M:"Mati kurang dari 12 bulan",EXPIRED_GTE_12M:"Mati lebih dari 12 bulan"};

function idMatch(stnkVal, plateVal, kind){
  const label = kind==="vin" ? "Nomor rangka" : "Nomor mesin";
  const na=norm(stnkVal), nb=norm(plateVal), dist=editDistance(na,nb);
  const normApplied = na===nb && String(stnkVal??"").toUpperCase()!==String(plateVal??"").toUpperCase();
  if(dist===0) return {name:label, verdict:"PASS", sev:"INFO", normApplied,
    msg: normApplied
      ? "Cocok setelah huruf O dibaca angka 0 dan huruf I dibaca angka 1. Penomoran rangka memang tidak memakai huruf I, O, dan Q karena gampang tertukar, dan pembacaan otomatis melakukan kekeliruan yang sama. Kecocokan seperti ini tetap dicatat terpisah dari kecocokan persis."
      : "Nomor pada plat sama persis dengan STNK.",
    a:stnkVal, b:plateVal};
  if(dist<=2) return {name:label, verdict:"NEEDS_REVIEW", sev:"WARNING", normApplied,
    msg:`Selisih ${dist} karakter, masih dalam batas toleransi pembacaan tapi belum dianggap cocok. Diteruskan ke penilai untuk dicek manual, bukan dibetulkan otomatis.`,
    a:stnkVal, b:plateVal};
  return {name:label, verdict:"MISMATCH", sev:"BLOCKER", normApplied,
    msg:`Selisih ${dist} karakter, jauh di atas batas toleransi pembacaan. Ini tanda identitas kendaraan tidak cocok dengan dokumennya, bukan salah baca. Persetujuan otomatis diblokir.`,
    a:stnkVal, b:plateVal};
}

function crossChecks(u){
  if(!reached(u.status, "ICR_DONE") || u.rangka == null) return [];
  const out = [idMatch(u.rangka,u.platRangka,"vin"), idMatch(u.mesin,u.platMesin,"engine")];
  const tampered = u.plateCond==="TAMPERED_SUSPECTED";
  out.push({name:"Kondisi plat", verdict:tampered?"MISMATCH":"PASS",
    sev: tampered?"BLOCKER":(["RUST_HEAVY","REPAINTED","SCRATCHED_OVER","ILLEGIBLE"].includes(u.plateCond)?"WARNING":"INFO"),
    msg: tampered
      ? "Ada bekas gerinda dan cat ulang di area nomor rangka. Ini tanda kecurangan, bukan masalah kosmetik. Persetujuan otomatis diblokir dan wajib ditinjau penilai."
      : `Plat terbaca <b>${PLATE_LABEL[u.plateCond]}</b>. Tidak ada indikasi nomor diubah.`});

  const age = Math.max(1, 2026-u.year), kmYr = Math.round(u.odo/age);
  if(kmYr<1000 && age>=5) out.push({name:"Kewajaran odometer", verdict:"MISMATCH", sev:"BLOCKER",
    msg:`Setara <b>${num(kmYr)} km/tahun</b> untuk unit berusia ${age} tahun. Ini pola khas odometer yang diputar balik. Angka rendah di unit tua ditangani lebih serius daripada angka tinggi, karena kilometer tinggi cuma masukan penilaian, bukan tanda kecurangan.`});
  else if(kmYr<2000 || kmYr>40000) out.push({name:"Kewajaran odometer", verdict:"NEEDS_REVIEW", sev:"WARNING",
    msg:`Setara <b>${num(kmYr)} km/tahun</b>, di luar rentang wajar 2.000 sampai 40.000.`});
  else out.push({name:"Kewajaran odometer", verdict:"PASS", sev:"INFO",
    msg:`Setara <b>${num(kmYr)} km/tahun</b>, masih dalam rentang wajar.`});

  if(u.defect==="photo_reuse") out.push({name:"Foto dipakai ulang", verdict:"MISMATCH", sev:"BLOCKER",
    msg:"Foto STNK persis sama dengan unit <b>CR-26-0401</b>. Dokumen yang sama difoto untuk dua unit berbeda."});

  const taxSev = (u.tax==="ACTIVE"||u.tax==="EXPIRING_SOON") ? "INFO" : "WARNING";
  out.push({name:"Status pajak", verdict: taxSev==="INFO"?"PASS":"NEEDS_REVIEW", sev:taxSev,
    msg: u.tax==="EXPIRED_GTE_12M"
      ? `Berlaku sampai <b>${u.taxUntil}</b>, mati lebih dari 12 bulan. Ini biaya nyata buat pembeli: denda progresif, dan kalau sudah lewat batas tertentu harus registrasi ulang. Dibaca dari panel pajak STNK.`
      : `Berlaku sampai <b>${u.taxUntil}</b>, ${TAX_LABEL[u.tax].toLowerCase()}.`});

  const low = icrRows(u).filter(r=>r.low);
  if(low.length) out.push({name:"Keterbacaan dokumen", verdict:"NEEDS_REVIEW", sev:"WARNING",
    msg:`${low.length} kolom terbaca di bawah ambang: ${low.map(r=>`${r.field.label} ${(r.conf*100).toFixed(0)}%`).join(", ")}. Unit masuk antrean verifikasi manual.`});

  if(u.defect==="unresolved_variant") out.push({name:"Varian kendaraan", verdict:"MISMATCH", sev:"BLOCKER",
    msg:`Kolom tipe di STNK berbunyi <b>${u.tipeRaw}</b> dan tidak cocok dengan satu pun entri katalog. STNK juga tidak mencatat transmisi, jadi varian tidak bisa ditebak. <b>Penetapan harga tidak dijalankan sampai penilai memilih varian.</b>`});

  return out;
}

}

/* Forward order of UnitStatus (app/enums.py). REJECTED sits level with
   ICR_DONE: it can only return to DRAFT, and carries no grade or price. */
const STATUS_RANK = {DRAFT:0, ICR_DONE:1, REJECTED:1, GRADED:2, PRICED:3,
  PENDING_APPROVAL:4, APPROVED:5};
const reached = (st, target) => (STATUS_RANK[st] ?? 0) >= STATUS_RANK[target];

function analyse(u){
  const st0 = statusOf(u);
  /* A unit that has not reached GRADED has no grade, and one that has not
     reached PRICED has no price. Showing either would present a value no
     stage has produced - an empty damage list is not grade A. */
  const hasGrade = reached(st0, "GRADED");
  const hasPrice = reached(st0, "PRICED");
  const grade = computeGrade(u.damages);
  const checks = crossChecks(u);
  const flagged = Object.keys(u.checklist||{});
  const blockers = checks.filter(c=>c.sev==="BLOCKER")
    .map(c=>`${c.name.toLowerCase()}: ${VERDICT_LABEL[c.verdict].toLowerCase()}`);
  flagged.forEach(k=>blockers.push(`checklist ditandai: ${CHECKLIST_LABEL[k].toLowerCase()}`));
  const priceable = hasPrice && u.defect!=="unresolved_variant" && u.otr != null;
  const lowFields = icrRows(u).filter(r=>r.low);
  const id = checks.slice(0,2);
  const identity = id.length === 0 ? null
                 : id.some(c=>c.verdict==="MISMATCH") ? "TIDAK COCOK"
                 : id.some(c=>c.verdict==="NEEDS_REVIEW") ? "PERIKSA" : "COCOK";
  return {grade, hasGrade, hasPrice, checks, blockers, flagged, lowFields, priceable, identity,
    price: priceable ? priceUnit(u, grade) : null};
}
const IDENTITY_TONE = {"COCOK":"green","PERIKSA":"amber","TIDAK COCOK":"red"};
/* No verdict yet reads as "—", never as a pass. */
const identityBadge = a => a.identity ? badge(a.identity, IDENTITY_TONE[a.identity]) : badge("—","");

    <div class="pagehead">
      <div class="eyebrow muted" style="margin-bottom:8px">ANTREAN</div>
      <h1>Antrean verifikasi</h1>
      <p>Unit dengan kolom yang terbaca di bawah ambang keyakinan.</p>
    </div>
    <section class="card">
      <div class="table-head between"><h2>Perlu diperiksa manual</h2>${badge(rows.length+" unit","amber")}</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Inspeksi / plat</th><th>Kendaraan</th><th>Kolom bermasalah</th>
          <th>Terendah</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows.length ? rows.map(({u,a})=>{
          const worst = a.lowFields.reduce((m,r)=>r.conf<m.conf?r:m, a.lowFields[0]);
          const st = statusOf(u);
          return `<tr data-code="${u.code}">

                <small>${esc(u.trim)} ${orDash(u.trans)}</small></td>
            <td style="white-space:normal">${a.lowFields.map(r=>
              `<span class="badge amber" style="margin:2px 4px 2px 0">${esc(r.field.label)}</span>`).join("")}</td>
            <td>${badge((worst.conf*100).toFixed(0)+"%","red")}<small>${esc(worst.field.label)}</small></td>
            <td>${badge(STATUS_LABEL[st], STATUS_TONE[st])}</td>
            <td><button class="btn ghost iconbtn" data-act="open" data-code="${u.code}">${icon("arrow")}</button></td>
          </tr>`;
        }).join("") : `<tr><td colspan="6"><div class="empty">Tidak ada unit yang perlu diverifikasi.</div></td></tr>`}
        </tbody>
      </table></div>
    </section>`;
}

/* The persistent decision rail. Everything needed to approve or reject sits
   here, so the tabs on the left stay pure evidence. */
function detailAside(u,a,st){
  const c = caps();
  const blocked = a.blockers.length>0, decided = App.decisions.has(u.code);
  const g = a.grade, p = a.price;

  const summary = `
    <section class="card pad-sm">
      <div class="flex" style="gap:14px">
        ${a.hasGrade ? `
        <div class="score-ring sm" data-g="${g.label}">${g.label}</div>
        <div style="min-width:0">
          <p style="font-weight:700">Grade ${g.label}</p>
          <p class="small muted">Skor kerusakan ${g.score.toFixed(1)}</p>
        </div>` : `
        <div class="score-ring sm" data-g="">—</div>
        <div style="min-width:0">
          <p style="font-weight:700">Belum digrade</p>
          <p class="small muted">Pemeriksaan visual belum dijalankan</p>
        </div>`}
      </div>
      <div class="line" style="margin:14px 0"></div>
      <div class="kv" style="margin:8px 0"><span>Kilometer</span><b>${num(u.odo)} km</b></div>
      <div class="kv" style="margin:8px 0"><span>Warna</span><b>${esc(u.colour)}</b></div>
      <div class="kv" style="margin:8px 0"><span>Isi silinder</span><b>${u.cc} cc</b></div>
      <div class="kv" style="margin:8px 0"><span>Bahan bakar</span><b>${esc(u.fuel)}</b></div>
      <div class="kv" style="margin:8px 0"><span>Pajak sampai</span><b>${esc(u.taxUntil)}</b></div>
      <div class="kv" style="margin:8px 0"><span>Identitas</span>
        <b>${identityBadge(a)}</b></div>
    </section>`;

  const price = !c.price ? "" : (p ? `
    <section class="card pad-sm price-panel">
      <span class="eyebrow muted">HARGA DASAR LELANG</span>
      <div class="big-price" style="font-size:30px">${money(p.base)}</div>
      <div class="line" style="margin:14px 0"></div>
      <div class="kv" style="margin:8px 0"><span>Harga pasar</span><b>${short(p.amp)}</b></div>
      <div class="kv" style="margin:8px 0"><span>Potongan kondisi</span><b>−${short(p.deduction)}</b></div>
      <div class="kv" style="margin:8px 0"><span>Rentang</span><b>${short(p.p30)} – ${short(p.p70)}</b></div>
    </section>` : `
    <section class="card pad-sm">
      <span class="eyebrow muted">HARGA</span>
      <p class="section-note" style="font-weight:600">Belum dihitung</p>
      <p class="small muted" style="margin-top:6px">${!reached(st,"PRICED")
        ? `Unit belum sampai tahap penetapan harga. Status sekarang: <b>${esc(STATUS_LABEL[st])}</b>.`
        : `Varian belum jelas. Penilai harus memilih varian sebelum harga dihitung.`}</p>
    </section>`);

  const controls = c.approve ? `
    <button class="btn primary" data-act="approve" data-code="${u.code}"
      ${blocked||st==="APPROVED"?"disabled":""}>${st==="APPROVED"?"Sudah disetujui":"Setujui harga dasar"}</button>
    <button class="btn ghost" data-act="reject" data-code="${u.code}" ${st==="REJECTED"?"disabled":""}>Tolak unit</button>
    ${decided?`<button class="btn ghost" data-act="undo" data-code="${u.code}">Batalkan keputusan</button>`:""}`
  : `<p class="small muted">Peran ${esc(ROLE_LABEL[App.role])} tidak bisa menyetujui. Pemisahan tugas
     ini disengaja: orang yang bisa mengubah grade tidak boleh jadi orang yang menandatangani harga
     hasilnya.</p>`;

  const decision = `
    <section class="card pad-sm">
      <div class="between"><h3>Keputusan</h3>${badge(STATUS_LABEL[st], STATUS_TONE[st])}</div>
      ${blocked
        ? `<div class="notice red section-note"><b>${a.blockers.length} temuan penghambat</b>
           <ul class="reason-list" style="color:inherit;font-size:13px">${
             a.blockers.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></div>`
        : `<div class="notice green section-note">Tidak ada penghambat.</div>`}
      <div class="stack" style="gap:8px;margin-top:14px">${controls}</div>
    </section>`;

  return summary + price + decision;
}

/* ==========================================================================
   Capture gallery
   ==========================================================================
   Markup renders synchronously with empty frames; the images are fetched from
   IndexedDB afterwards by hydrateGalleries(). render() is synchronous and the
   photo store is not, so the two are deliberately separated rather than making
   the whole render path async.
   ========================================================================== */
function galleryMarkup(u, kind, heading){
  const id = `gal-${kind}-${u.code}`;
  return `
    <section class="card pad">
      <div class="between"><h2>${esc(heading)}</h2>
        <span class="small muted" data-gal-count="${id}"></span></div>
      <div class="gal" data-gal="${id}" data-code="${u.code}" data-kind="${kind}">
        <div class="gal-main" data-gal-main>
          <div class="gal-empty">Memuat foto…</div>
        </div>
        <div class="gal-strip" data-gal-strip></div>
        <p class="gal-note" data-gal-note></p>
      </div>
    </section>`;
}

/* Live object URLs, revoked before each hydrate so a long session does not
   accumulate them. */
let GAL_URLS = [];
const GAL_STATE = new Map();   // gallery id -> active index

function revokeGalleryUrls(){
  GAL_URLS.forEach(u=>{ try{ URL.revokeObjectURL(u); }catch{} });
  GAL_URLS = [];
}

async function hydrateGalleries(){
  const roots = [...document.querySelectorAll("[data-gal]")];
  if(!roots.length) return;
  revokeGalleryUrls();

  for(const root of roots){
    const id = root.dataset.gal, code = root.dataset.code, kind = root.dataset.kind;
    const main = root.querySelector("[data-gal-main]");
    const strip = root.querySelector("[data-gal-strip]");
    const note = root.querySelector("[data-gal-note]");
    const count = document.querySelector(`[data-gal-count="${id}"]`);

    let shots = [];
    try{ shots = (await CareadyPhotos.manifest(code)).filter(x=>x.kind===kind); }
    catch(e){ shots = []; }

    if(!shots.length){
      main.innerHTML = `<div class="gal-empty">Tidak ada foto tersimpan untuk unit ini.<br>
        Unit contoh bawaan tidak menyertakan foto — kirim inspeksi dari aplikasi inspektur.</div>`;
      strip.innerHTML = ""; note.textContent = "";
      if(count) count.textContent = "";
      continue;
    }

    const idx = Math.min(GAL_STATE.get(id) ?? 0, shots.length-1);
    GAL_STATE.set(id, idx);
    if(count) count.textContent = `${shots.length} foto`;

    const canUnmask = caps().unmask;
    const revealed = App.unmasked.has(code) && canUnmask;

    // thumbnails
    const thumbs = await Promise.all(shots.map(async (sh,i)=>{
      const url = await CareadyPhotos.objectUrl(code, sh.capId);
      if(url) GAL_URLS.push(url);
      const blur = sh.pii && !revealed ? " pii-blur" : "";
      return `<button class="gal-thumb${blur}" data-act="gal-pick" data-gal-id="${id}"
        data-i="${i}" aria-current="${i===idx}" title="${esc(sh.title)}">
        ${url?`<img src="${url}" alt="${esc(sh.title)}">`:""}</button>`;
    }));
    strip.innerHTML = thumbs.join("");

    // active frame
    const act = shots[idx];
    const url = await CareadyPhotos.objectUrl(code, act.capId);
    if(url) GAL_URLS.push(url);
    const blurred = act.pii && !revealed;
    main.className = "gal-main" + (blurred ? " pii-blur" : "");
    main.innerHTML = `
      ${url?`<img src="${url}" alt="${esc(act.title)}">`:`<div class="gal-empty">Foto tidak terbaca.</div>`}
      ${blurred ? `<div class="pii-shield">
          <p>Foto STNK memuat nama dan alamat pemilik. Dikaburkan secara bawaan.</p>
          ${canUnmask
            ? `<button class="btn" data-act="unmask" data-code="${code}">Buka · akses tercatat</button>`
            : badge("tidak berwenang")}
        </div>` : ""}
      ${shots.length>1?`
        <button class="gal-nav" data-act="gal-prev" data-gal-id="${id}" aria-label="Sebelumnya">‹</button>
        <button class="gal-nav" data-act="gal-next" data-gal-id="${id}" aria-label="Berikutnya">›</button>`:""}
      <div class="gal-cap"><span>${esc(act.title)}</span>
        <span>${idx+1} / ${shots.length}${act.w?` · ${act.w}×${act.h}`:""}</span></div>`;

    note.textContent = kind === "doc"
      ? "Sumber pembacaan dokumen di atas. Disimpan ulang pada resolusi lebih rendah."
      : "Sembilan sudut wajib. Dasar temuan kerusakan di samping.";
  }
}

function stepGallery(id, delta){
  const root = document.querySelector(`[data-gal="${id}"]`);
  if(!root) return;
  const n = root.querySelectorAll("[data-act='gal-pick']").length;
  if(!n) return;
  GAL_STATE.set(id, ((GAL_STATE.get(id) ?? 0) + delta + n) % n);
  hydrateGalleries();
}

document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const act = b.dataset.act, id = b.dataset.galId;
  if(act === "gal-prev"){ stepGallery(id, -1); }
  else if(act === "gal-next"){ stepGallery(id, +1); }
  else if(act === "gal-pick"){ GAL_STATE.set(id, Number(b.dataset.i)); hydrateGalleries(); }
});

function tabIdentitas(u,a){
  const c = caps(), unmasked = App.unmasked.has(u.code) && c.unmask;
  const docGallery = galleryMarkup(u, "doc", "Foto dokumen");
  const rows = icrRows(u), low = rows.filter(r=>r.low).length;

  const icrBody = rows.map(r=>{
    const f = r.field;
    let shown = r.value, btn = "";
    if(f.pii){
      shown = unmasked ? r.value : MASKERS[f.pii](r.value);
      btn = c.unmask
        ? ` <button class="mini-btn" data-act="unmask" data-code="${u.code}">${unmasked?"Tutup":"Buka"}</button>`
        : ` ${badge("tidak berwenang")}`;
    }
    return `<tr data-low="${r.low}">
      <td>${esc(f.label)}</td>
      <td class="val" style="white-space:normal;max-width:280px">${esc(shown)}${btn}</td>
      <td><span class="conf"><span class="bar"><span style="width:${(r.conf*100).toFixed(0)}%"></span></span>
        <span class="conf-v">${(r.conf*100).toFixed(0)}%</span></span></td>
      <td class="muted small">min ${(f.min*100).toFixed(0)}%</td>
      <td class="muted small">${esc(f.src)}</td>
      <td>${r.low?badge("Perlu dicek","amber"):badge("Terbaca","green")}</td>
    </tr>`;
  }).join("");

  const checks = a.checks.map(ch=>{
    let diff = "";
    if(ch.a && ch.b && (ch.verdict!=="PASS" || ch.normApplied)){
      const chars = diffChars(ch.a,ch.b);
      diff = `<div class="diff">
        <span class="diff-label">STNK</span><span class="diff-chars">${esc(ch.a)}</span>
        <span class="diff-label">Plat</span><span class="diff-chars">${chars.map(x=>
          x.d==="same"?esc(x.c):`<i data-d="${x.d}">${esc(x.c)}</i>`).join("")}</span></div>`;
    }
    return `<div class="evidence-row" style="align-items:flex-start;flex-direction:column;gap:6px">
      <div class="between" style="width:100%">
        <p style="font-weight:600;font-size:14px">${esc(ch.name)}</p>
        <span class="pills">${ch.normApplied?badge("cocok setelah penyesuaian huruf","amber"):""}
          ${badge(VERDICT_LABEL[ch.verdict], SEV_BADGE[ch.sev])}</span>
      </div>
      <p class="small muted" style="line-height:1.55">${ch.msg}</p>${diff}
    </div>`;
  }).join("");

  return `
    ${docGallery}

    <section class="card pad">
      <div class="between"><h2>Hasil pembacaan dokumen</h2>
        ${low?badge(low+" dari "+rows.length+" kolom perlu dicek","amber"):badge("Semua kolom terbaca","green")}</div>
      ${low?`<div class="notice amber section-note">Unit ini masuk antrean verifikasi manual sampai
        kolom di bawah ambang diperiksa orang.</div>`:""}
      <div class="table-wrap" style="margin-top:18px"><table>
        <thead><tr><th>Kolom</th><th>Terbaca</th><th>Keyakinan</th><th>Ambang</th><th>Sumber</th><th>Status</th></tr></thead>
        <tbody>${icrBody}</tbody></table></div>
      <p class="small muted section-note">Ambang keyakinan berbeda per kolom. Nomor rangka dan nomor
        mesin dituntut 92%, warna cukup 70%, karena warna salah tidak merugikan siapa pun sedangkan
        nomor rangka salah merugikan semuanya.</p>
    </section>

    <section class="card pad">
      <div class="between"><h2>Pemeriksaan silang</h2>${identityBadge(a)}</div>
      <p class="small muted section-note">STNK adalah sumber utama untuk merk, tipe, model, dan tahun.
        Plat rangka dipakai sebagai pembanding dan tidak pernah menimpa isi STNK.</p>
      <div style="margin-top:8px">${checks}</div>
    </section>`;
}

function tabKondisi(u,a){
  const g = a.grade;
  const extGallery = galleryMarkup(u, "ext", "Foto eksterior");
  const damages = !a.hasGrade ? "" : g.rows.map(r=>`
    <div class="damage">
      <div class="damage-icon" data-s="${r.sev}">${icon("alert")}</div>
      <div class="damage-body">
        <div class="damage-title">${esc(PANEL_LABEL[r.panel]??r.panel)}</div>
        <div class="damage-meta">${esc(DAMAGE_LABEL[r.type])} · tingkat ${r.sev} ·

        <div class="damage-cost">${r.points.toFixed(1)} poin</div>

      <p class="small muted section-note">${esc(g.band.desc)}. Skor
        <b style="color:var(--ink)">${g.score.toFixed(1)}</b>, band ${g.pre}${
        g.pre!==g.label?`, diturunkan ke ${g.label}`:""}. Setiap poin bisa ditelusuri ke satu temuan.</p>
      ${g.applied.length?`<div class="notice amber section-note"><b>Grade diturunkan otomatis</b>
        <ul class="reason-list" style="color:inherit;font-size:13px">${g.applied.map(r=>
          `<li>${esc(r.why)}, maksimal grade <b>${r.cap}</b>.</li>`).join("")}</ul></div>`:""}
      <div class="stack" style="gap:10px;margin-top:16px">${damages||`<p class="muted">Tidak ada temuan.</p>`}</div>`
      : `<p class="small muted section-note">Pemeriksaan visual eksterior belum dijalankan untuk unit ini,
         jadi belum ada temuan maupun skor. Daftar kosong di sini berarti belum diperiksa —
         bukan berarti tidak ada kerusakan.</p>`}
    </section>

    <section class="card pad">
      <div class="between"><h2>Checklist non-visual</h2>
        ${a.flagged.length?badge(a.flagged.length+" ditandai","red"):badge("Semua bersih","green")}</div>
      <p class="small muted section-note">Penilaian dari foto tidak bisa melihat bekas banjir,
        perbaikan rangka, kondisi mesin dan transmisi, atau odometer yang diputar.</p>
      <div style="margin-top:6px">${checklist}</div>
    </section>`;
}

function tabPenilaian(u,a){
  const c = caps();
  if(!c.price) return `
    <section class="card pad">
      <div class="between"><h2>Penilaian</h2>${badge("Dibatasi peran","amber")}</div>
      <p class="muted section-note">Peran ${esc(ROLE_LABEL[App.role])} mengurus konfigurasi dan
        katalog, bukan keputusan komersial. Data harga tidak dikirim ke sesi ini sama sekali.</p>
    </section>`;

  /* Two different reasons a unit has no price, and they need different copy.
     An unresolved variant is a blocker the appraiser must clear; not having
     reached PRICED yet is simply the pipeline not having run. The variant
     message used to be shown for both, so it read as a blocker on every
     freshly submitted unit. */
  if(!a.priceable) return !reached(statusOf(u), "PRICED") ? `
    <section class="card pad">
      <div class="between"><h2>Penilaian</h2>${badge("Belum dihitung","")}</div>
      <p class="small muted section-note">Unit berada pada status
        <b>${esc(STATUS_LABEL[statusOf(u)])}</b>. Harga dasar dihitung setelah grading
        eksterior selesai dan varian sudah terikat ke katalog — belum ada angka untuk
        ditampilkan, dan menampilkan angka apa pun di tahap ini akan menyesatkan.</p>
      <ul class="reason-list">
        <li>Pemeriksaan visual eksterior: belum dijalankan.</li>
        <li>Varian dan harga baru (OTR): belum terikat ke katalog.</li>
      </ul>
    </section>` : `
    <section class="card pad">
      <div class="between"><h2>Penilaian</h2>${badge("Belum dihitung","amber")}</div>
      <div class="notice amber section-note">Harga belum bisa dihitung karena varian belum jelas.</div>
      <ul class="reason-list">
        <li>Kolom tipe di STNK (<b>${esc(u.tipeRaw ?? "tidak terbaca")}</b>) tidak cocok dengan katalog.</li>
        <li>STNK tidak mencatat transmisi, jadi varian tidak bisa disimpulkan.</li>
        <li>Penilai harus memilih varian secara manual sebelum harga dihitung.</li>
      </ul>
      <p class="small muted section-note">Beda trim dan beda transmisi menggeser harga cukup jauh,
        jadi menebak varian berarti salah arah sejak awal.</p>
    </section>`;

  const p = a.price;
  return `
    <section class="card pad">
      <h2>Rincian harga</h2>
      <div style="margin-top:14px">
        <div class="kv"><span>Harga pasar lelang, kondisi rata-rata</span><b>${money(p.amp)}</b></div>
        <div class="kv"><span>Potongan kondisi</span><b style="color:var(--danger)">−${money(p.deduction)}</b></div>
        <div class="line" style="margin:14px 0"></div>

        <div class="kv"><span>Perkiraan tengah</span><b>${short(p.p50)}</b></div>
        <div class="kv"><span>Optimis</span><b>${short(p.p70)}</b></div>

function tabRiwayat(u,a){
  const base = [
    {i:"file",  t:"Inspeksi diterima",  d:`${u.code} dikirim dari ${u.branch}`, n:""},
    {i:"shield",t:"Dokumen dibaca",     d:`${ICR_FIELDS.length} kolom diekstraksi`,
     n: a.lowFields.length?`${a.lowFields.length} kolom di bawah ambang keyakinan`:""},
    {i:"check", t:"Pemeriksaan silang", d:`${a.checks.length} pemeriksaan dijalankan`,
     n: a.blockers.length?`${a.blockers.length} temuan penghambat`:"Tidak ada penghambat"},
    {i:"alert", t:a.hasGrade?"Grade dihitung":"Grade belum dihitung",
     d:a.hasGrade?`Grade ${a.grade.label}, skor ${a.grade.score.toFixed(1)}`
                 :"Pemeriksaan visual belum dijalankan",
     n: a.hasGrade && a.grade.applied.length?a.grade.applied.map(r=>r.why).join(" · "):""}
  ];
  const session = App.log.map(e=>({i:"check", t:e.action, d:`${e.who} · ${e.t}`, n:e.detail}));

  return `
    <section class="card pad">
      <h2>Riwayat unit</h2>
      <p class="small muted section-note">Catatan aktivitas tidak bisa diubah atau dihapus. Log hanya
        mencatat bahwa sebuah data pemilik dibuka, tidak pernah isinya.</p>
      <div class="timeline">
        ${[...session, ...base].map(e=>`
          <div class="event">
            <div class="event-dot">${icon(e.i)}</div>
            <div style="flex:1;min-width:0">
              <p style="font-weight:600">${esc(e.t)}</p>
              <small>${esc(e.d)}</small>
              ${e.n?`<div class="event-note">${esc(e.n)}</div>`:""}
            </div>
          </div>`).join("")}
      </div>
    </section>`;
}

/* ==========================================================================

  const c = caps();
  const pts = Object.keys(RUBRIC.basePoints).map(type=>`
    <label for="pt-${type}-1">${esc(DAMAGE_LABEL[type])}</label>
    ${[1,2,3].map(s=>`<input type="number" id="pt-${type}-${s}" min="0" max="99" step="1"
      value="${RUBRIC.basePoints[type][s]}" data-type="${type}" data-sev="${s}"
      ${c.config?"":"disabled"} aria-label="${esc(DAMAGE_LABEL[type])} tingkat ${s}">`).join("")}
    <span class="dmg-note">${esc(DAMAGE_NOTE[type])}</span>`).join("");

  return `
    <div class="pagehead">
      <div class="eyebrow muted" style="margin-bottom:8px">KONFIGURASI</div>
      <h1>Rubrik penilaian</h1>
      <p>Angka ini menentukan skor kerusakan, dan skor menentukan grade.
         Ubah satu angka, semua grade di inventaris ikut berubah.</p>
    </div>
    <div class="notice ${c.config?"":"amber"}" style="margin-bottom:20px">
      ${c.config
        ? "<b>Bobot ini belum final.</b> Angkanya dipilih sebagai titik awal dan masih menunggu penyesuaian dari tim penilai. Selama belum final, setiap grade ditandai sementara dan keyakinan harga diturunkan satu tingkat."
        : "<b>Hanya peran Admin yang bisa mengubah bobot.</b> Anda bisa melihat angkanya dan dampaknya di inventaris, tapi perubahannya dikunci."}
    </div>
    <div class="grid2">
      <section class="card pad">
        <h2>Poin per jenis dan tingkat</h2>
        <div class="pt-grid" id="points" style="margin-top:18px">
          <span></span><span class="hd">Ringan</span><span class="hd">Sedang</span><span class="hd">Berat</span>
          ${pts}
        </div>
        <p class="small muted section-note"><b>Celah panel</b> sengaja dipasang jauh di atas
          <b>baret</b> di setiap tingkat. Baret 10 cm cuma biaya poles. Celah panel 10 mm menandakan
          mobil pernah diperbaiki struktural, dan itu menurunkan nilai jual jauh lebih dalam.</p>
      </section>
      <section class="card pad">
        <div class="between"><h2>Dampak pada inventaris</h2>${badge("Langsung","blue")}</div>
        <div class="table-wrap" style="margin-top:18px"><table>
          <thead><tr><th>Unit</th><th>Kendaraan</th><th>Skor</th><th>Grade</th><th>Perubahan</th></tr></thead>
          <tbody id="impact"></tbody></table></div>
        <p class="small muted section-note" id="bandnote"></p>
      </section>
    </div>`;
}

function renderImpact(){
  const tb = $("impact");
  if(!tb) return;
  tb.innerHTML = UNITS.filter(u=>reached(statusOf(u),"GRADED")).map(u=>{
    const g = computeGrade(u.damages), was = App.baseline.get(u.code);
    let shift = `<span class="muted">tetap</span>`;
    if(was && was.label!==g.label){
      const dir = BAND_ORDER.indexOf(g.label) > BAND_ORDER.indexOf(was.label) ? "worse" : "better";
      shift = `<span class="shift" data-dir="${dir}">${was.label} ke ${g.label}</span>`;
    } else if(was && Math.abs(was.score-g.score)>0.05){
      const d = g.score - was.score;
      shift = `<span class="muted mono">${d>0?"+":""}${d.toFixed(1)} poin</span>`;
    }
    return `<tr><td class="mono">${u.code.replace("CR-26-","")}</td>
      <td>${esc(u.merk)} ${esc(u.model)}</td><td class="mono">${g.score.toFixed(1)}</td>
      <td><span class="grade" data-g="${g.label}" style="width:24px;height:24px;font-size:13px">${g.label}</span></td>
      <td>${shift}</td></tr>`;
  }).join("");
  const bn = $("bandnote");
  if(bn) bn.innerHTML = "Batas skor tiap grade: " +
    RUBRIC.bands.map(b=>`<b>${b.label}</b> sampai ${b.max ?? "tak terbatas"}`).join(" · ") +
    ". Penurunan otomatis dijalankan setelah grade ditentukan, dan hanya bisa memperburuk.";
}

/* ==========================================================================
   Router
   ========================================================================== */
const CRUMB = {ringkasan:"Ringkasan", inventaris:"Inventaris unit",
  verifikasi:"Antrean verifikasi", rubrik:"Rubrik penilaian", detail:"Detail unit"};

function render(){
  const views = {ringkasan:viewRingkasan, inventaris:viewInventaris,
    verifikasi:viewVerifikasi, rubrik:viewRubrik, detail:viewDetail};
  $("main").innerHTML = views[App.view]();
  $("crumb").textContent = CRUMB[App.view];
  /* Images come from IndexedDB, so they arrive after this synchronous pass. */
  hydrateGalleries();

  // Detail is reached from a row, so inventory stays lit while reading one.
  const lit = App.view==="detail" ? "inventaris" : App.view;
  document.querySelectorAll(".navbtn").forEach(b=>
    b.classList.toggle("active", b.dataset.view===lit));

  $("c-inv").textContent = UNITS.length;
  const verif = UNITS.filter(u=>analyse(u).lowFields.length).length;
  $("c-ver").textContent = verif || "";
  $("c-ver").style.display = verif ? "" : "none";
  $("u-role").textContent = ROLE_LABEL[App.role];

  if(App.view==="ringkasan" || App.view==="inventaris") renderRows();
  if(App.view==="rubrik") renderImpact();
  window.scrollTo({top:0});
}

function go(view){ App.view = view; render(); }

$("nav").addEventListener("click", e=>{
  const b = e.target.closest(".navbtn");
  if(b) go(b.dataset.view);
});

$("role").addEventListener("change", e=>{
  App.role = e.target.value;
  App.unmasked.clear();
  render();
});

document.addEventListener("click", e=>{
  const btn = e.target.closest("[data-act]");
  if(btn){
    const {act, code, view, tab} = btn.dataset;
    if(act==="goto"){ go(view); return; }
    if(act==="tab"){ App.tab = tab; render(); return; }
    if(act==="open"){
      App.selected = code; App.tab = tab || "identitas"; go("detail"); return;
    }
    if(act==="clear"){
      App.filters = {q:"", status:"all", grade:"all"}; render(); return;
    }
    if(act==="unmask"){
      if(App.unmasked.has(code)) App.unmasked.delete(code);
      else { App.unmasked.add(code); addLog("Data pemilik dibuka", `${code} · nama, alamat, nomor BPKB · akses tercatat`); }
      render(); return;
    }
    if(act==="approve"){
      App.decisions.set(code,"APPROVED");
      addLog("Harga dasar disetujui", `${code} · tidak ada temuan penghambat · status menjadi Siap lelang`);
      render(); return;
    }
    if(act==="reject"){
      App.decisions.set(code,"REJECTED");
      addLog("Unit ditolak", `${code} · status menjadi Ditolak · unit bisa dikerjakan ulang`);
      render(); return;
    }
    if(act==="undo"){
      const u = UNITS.find(x=>x.code===code);
      App.decisions.delete(code);
      addLog("Keputusan dibatalkan", `${code} · status kembali ke ${STATUS_LABEL[u.status]}`);
      render(); return;
    }
  }
  // Whole-row click, as long as it did not land on a button inside the row.
  const row = e.target.closest("tr[data-code]");
  if(row && !e.target.closest("button")){
    App.selected = row.dataset.code; App.tab = "identitas"; go("detail");
  }
});

document.addEventListener("input", e=>{
  if(e.target.id === "q"){ App.filters.q = e.target.value; renderRows(); return; }
  const inp = e.target.closest("#points input[data-type]");
  if(inp && !inp.disabled){
    const v = parseInt(inp.value,10);
    if(Number.isNaN(v) || v<0) return;
    RUBRIC.basePoints[inp.dataset.type][Number(inp.dataset.sev)] = v;
    renderImpact();
  }
});

document.addEventListener("change", e=>{
  if(e.target.id === "f-status"){ App.filters.status = e.target.value; renderRows(); }
  if(e.target.id === "f-grade"){  App.filters.grade  = e.target.value; renderRows(); }
});

/* ==========================================================================
   Demo reset
   ==========================================================================
   Two clicks, because one misclick mid-presentation would empty the thing
   being presented. Removes submitted units and their photos; the fourteen
   seeded units are compiled into this file and always come back.

   Note this is a prototype affordance only. The real system has no delete:
   a unit that should not proceed goes to REJECTED, and the audit trail is
   append-only at the database level. A delete button here would teach the
   wrong model, which is why this one is labelled as demo tooling and sits
   nowhere near the approval controls.
   ========================================================================== */
let resetTimer = null;

function resetHint(msg){ const h = $("reset-hint"); if(h) h.textContent = msg || ""; }

function disarmReset(){
  const b = $("reset-demo");
  if(!b) return;
  b.dataset.armed = "false";
  b.textContent = "Muat ulang data";
  resetHint("");
  clearTimeout(resetTimer);
}

async function doReset(){
  const n = CareadyStore.units().length;
  let photos = 0;
  try{ photos = (await CareadyPhotos.usage()).count; }catch{}
  await CareadyStore.clear();
  GAL_STATE.clear();
  App.unmasked.clear();
  App.decisions.clear();
  App.baseline.clear();
  App.log.length = 0;
  disarmReset();
  rebuildUnits();
  App.selected = UNITS[0].code;
  App.view = "inventaris";
  render();
  addLog("Data dimuat ulang", `${n} unit dan ${photos} foto dikosongkan`);
  resetHint(`${n} unit, ${photos} foto dikosongkan.`);
  setTimeout(()=>resetHint(""), 6000);
}

document.addEventListener("click", e=>{
  const b = e.target.closest("#reset-demo");
  if(!b){ if($("reset-demo")?.dataset.armed === "true") disarmReset(); return; }
  if(b.dataset.armed === "true"){ doReset(); return; }
  const n = CareadyStore.units().length;
  if(!n){ resetHint("Tidak ada data untuk dikosongkan."); setTimeout(()=>resetHint(""), 3000); return; }
  b.dataset.armed = "true";
  b.textContent = `Hapus ${n} unit — klik lagi`;
  resetHint("Unit contoh bawaan tetap.");
  resetTimer = setTimeout(disarmReset, 5000);
});

/* Boot */
rebuildUnits();
if(!UNITS.some(u=>u.code===App.selected)) App.selected = UNITS[0].code;
render();

/* A dashboard left open picks up an inspection submitted in another tab. */
CareadyStore.subscribe(()=>{
  const before = new Set(UNITS.map(u=>u.code));
  rebuildUnits();
  const fresh = UNITS.find(u=>!before.has(u.code));
  if(fresh) addLog("Unit baru diterima", `${fresh.code} · ${fresh.plat}`);
  if(!UNITS.some(u=>u.code===App.selected)) App.selected = UNITS[0].code;
  render();
});
</script>
